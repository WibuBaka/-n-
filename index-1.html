<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ôn tập giữa kỳ I – Tin, Sử, Lý, Anh &amp; GDQP-AN 11</title>
<style>
:root{--bg:#46178f;--r:#e21b3c;--b:#1368ce;--y:#d89e00;--g:#26890c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#fff}
button,select,input{font:inherit}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{margin:.2em 0 0;font-size:2rem;text-align:center}.sub{text-align:center;opacity:.85;margin:.3em 0 1em}
.card{background:#fff;color:#222;border-radius:14px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.card label{display:block;font-weight:600;font-size:.9rem;margin-bottom:10px}
.card input[type=text],.card select{display:block;width:100%;margin-top:4px;padding:10px;border:2px solid #ccc;border-radius:8px;background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.chk{display:flex!important;align-items:center;gap:8px;font-weight:500!important}
.chk input{width:18px;height:18px}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:14px;font-weight:700;font-size:1.1rem;cursor:pointer;color:#fff;background:#26890c;box-shadow:0 4px 0 #1a5e08;margin-top:10px}
.btn.alt{background:#1368ce;box-shadow:0 4px 0 #0c4a94}.btn.red{background:#e21b3c;box-shadow:0 4px 0 #a01229}
.btn:active{transform:translateY(3px);box-shadow:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;margin-bottom:8px}
.top .lbl{opacity:.85;font-weight:500;font-size:.9rem}
.sc{background:rgba(0,0,0,.25);padding:4px 12px;border-radius:99px}
.bar{height:12px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:100%;background:#ffd02b;transition:width .1s linear}
.qbox{background:#fff;color:#222;border-radius:14px;padding:18px;margin-bottom:14px;text-align:center}
.q{font-size:1.25rem;font-weight:700;line-height:1.45}
.ctx{font-size:.95rem;font-weight:400;text-align:left;background:#f1eefb;border-left:4px solid #46178f;padding:10px 12px;margin-bottom:12px;border-radius:6px;max-height:28vh;overflow:auto}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans.tf .a{min-height:120px;font-size:1.5rem;justify-content:center}
.a{display:flex;align-items:center;gap:12px;min-height:84px;padding:12px 14px;border:0;border-radius:10px;color:#fff;font-weight:600;font-size:1rem;text-align:left;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.a b{font-size:1.6rem;flex:none;width:1.6rem;text-align:center}
.c0{background:var(--r)}.c1{background:var(--b)}.c2{background:var(--y)}.c3{background:var(--g)}
.a:disabled{cursor:default}.a.dim{opacity:.3}.a.ok{outline:4px solid #fff;animation:pop .35s}.a.no{opacity:.55;text-decoration:line-through}
@keyframes pop{50%{transform:scale(1.04)}}
.fb{margin-top:14px;border-radius:14px;padding:14px 16px;color:#222;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.fb.good{border-left:10px solid #26890c}.fb.bad{border-left:10px solid #e21b3c}
.fb h2{margin:0;font-size:1.3rem}.fb p{margin:.2em 0 0}
.fb .btn{width:auto;margin:0;padding:10px 22px}
.board{margin-top:12px;background:rgba(0,0,0,.25);border-radius:12px;padding:8px 12px}
.board div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.board div:last-child{border:0}.board .me{color:#ffd02b;font-weight:700}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:18px 0 8px;min-height:180px}
.podium div{width:30%;max-width:150px;text-align:center;border-radius:10px 10px 0 0;padding:8px 4px;background:#7b3fe4;font-weight:700;word-break:break-word}
.podium .p1{height:170px;background:#d89e00}.podium .p2{height:130px;background:#8a8a8a}.podium .p3{height:100px;background:#a86a2d}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stats div{background:rgba(255,255,255,.14);border-radius:10px;padding:10px;text-align:center}
.stats b{display:block;font-size:1.5rem}
.rev{background:#fff;color:#222;border-radius:12px;padding:6px 14px;margin-top:10px}
.rev details{border-bottom:1px solid #eee;padding:8px 0}.rev summary{cursor:pointer;font-weight:600}
.rev p{margin:.4em 0;font-size:.92rem}.ok-t{color:#26890c;font-weight:600}.no-t{color:#e21b3c}
.sts{display:grid;gap:10px;margin-bottom:6px}
.st{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px}
.st p{margin:0 0 8px;line-height:1.45}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn .a{min-height:48px;justify-content:center;font-size:1.05rem}
.st.picked:not(.done) .a:not(.sel){opacity:.5}.a.sel{outline:4px solid #fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.top .lbl{flex:1;text-align:center}
.xb{flex:none;width:38px;height:38px;border:0;border-radius:50%;background:rgba(0,0,0,.3);color:#fff;font-size:1.2rem;font-weight:700;cursor:pointer;line-height:1}
.xb:hover{background:#e21b3c}
.back{border:0;background:rgba(255,255,255,.15);color:#fff;padding:8px 14px;border-radius:99px;font-weight:600;cursor:pointer}
.subs{display:grid;gap:14px;margin-top:20px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;font-size:.95em;line-height:1.15}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .25em}.fr>span:last-child{padding:0 .25em}
.sq{display:inline-block;white-space:nowrap;border-top:1.5px solid currentColor;padding:.18em .12em 0;margin-left:1px;vertical-align:middle}
sub,sup{font-size:.72em;line-height:0}
.qimg{display:block;max-width:100%;max-height:300px;margin:12px auto 0;background:#fff;border-radius:8px}
.sa{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:14px;margin-bottom:12px}
.sa input{flex:1;min-width:0;font-size:1.4rem;padding:10px;border:3px solid #ccc;border-radius:10px;color:#222}
.sa input.ok{border-color:#26890c;background:#e6f7e0}.sa input.no{border-color:#e21b3c;background:#fde8ec}
.sa .unit{font-weight:700;color:#333;font-size:1.2rem}
.exp{font-size:.9rem;line-height:1.9;margin:.5em 0 0;color:#444}.st .exp{color:#fff;opacity:.9}
.sbj{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:0;border-radius:16px;padding:20px;color:#fff;text-align:left;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.28)}
.sbj:active{transform:translateY(4px);box-shadow:none}
.sbj .ic{font-size:2.4rem}.sbj b{font-size:1.5rem}.sbj small{opacity:.9;font-size:.95rem}.sbj em{font-style:normal;margin-top:6px;background:rgba(0,0,0,.25);padding:3px 12px;border-radius:99px;font-size:.85rem}
@media(min-width:640px){.subs{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.yn .a{min-height:44px}}
@media(max-width:600px){.ans{grid-template-columns:1fr}.a{min-height:64px}.ans.tf{grid-template-columns:1fr 1fr}.q{font-size:1.1rem}}
.q.ml{text-align:left;font-size:1.05rem;font-weight:600}
u{text-decoration:underline;text-underline-offset:3px}
</style></head>
<body><div id="app"></div>
<script>
const Q_QP=[{"id":"1","lesson":1,"type":"mc","label":"Câu 1","q":"Biên giới quốc gia của nước Cộng hòa xã hội chủ nghĩa Việt Nam bao gồm những bộ phận nào?","opts":["Biên giới trên đất liền, biên giới trên biển, biên giới trên không và biên giới trong lòng đất.","Đất liền, vùng biển và vùng trời.","Lãnh thổ và các cột mốc biên giới.","Lãnh thổ, quần đảo và vùng trời."],"a":0},{"id":"2","lesson":1,"type":"mc","label":"Câu 2","q":"Vùng nước tiếp giáp với bờ biển, ở phía trong đường cơ sở và là bộ phận lãnh thổ Việt Nam được gọi là gì?","opts":["Nội thủy.","Lãnh hải.","Thềm lục địa.","Vùng tiếp giáp lãnh hải."],"a":0},{"id":"3","lesson":1,"type":"mc","label":"Câu 3","q":"Vùng biển tiếp liền và nằm ngoài lãnh hải Việt Nam, hợp với lãnh hải thành vùng biển rộng 200 hải lý tính từ đường cơ sở, được gọi là gì?","opts":["Vùng nội thủy.","Thềm lục địa.","Vùng đặc quyền kinh tế.","Vùng tiếp giáp lãnh hải."],"a":2},{"id":"4","lesson":1,"type":"mc","label":"Câu 4","q":"Theo Luật Biển Việt Nam năm 2012, đường cơ sở dùng để tính chiều rộng lãnh hải Việt Nam là đường nào?","opts":["Đường cơ sở do Chính phủ công bố.","Đường cơ sở thẳng do Chính phủ công bố.","Đường cơ sở thông thường.","Đường cơ sở thông thường và đường cơ sở thẳng."],"a":1},{"id":"5","lesson":1,"type":"mc","label":"Câu 5","q":"Theo Chiến lược bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa trong tình hình mới, những ai tôn trọng (……), thiết lập và mở rộng quan hệ hữu nghị, hợp tác bình đẳng, cùng có lợi với Việt Nam đều là đối tác.","opts":["Độc lập, chủ quyền.","Độc lập, tự do.","Độc lập, tự quyết, tự do.","Độc lập, chủ quyền, tự do."],"a":0},{"id":"6","lesson":1,"type":"mc","label":"Câu 6","q":"Bất kỳ thế lực nào có âm mưu và hành động chống phá (……) trong sự nghiệp xây dựng và bảo vệ Tổ quốc đều là đối tượng đấu tranh của chúng ta.","opts":["Hòa bình của nước ta.","Độc lập, tự do của nước ta.","Mục tiêu của nước ta.","Chế độ xã hội chủ nghĩa của nước ta."],"a":2},{"id":"7","lesson":1,"type":"mc","label":"Câu 7","q":"Những ai tôn trọng độc lập, chủ quyền và thiết lập, mở rộng quan hệ hữu nghị, hợp tác bình đẳng, cùng có lợi với Việt Nam đều là gì?","opts":["Đồng chí của chúng ta.","Đối tác của chúng ta.","Đối tượng của chúng ta.","Bạn bè của chúng ta."],"a":1},{"id":"8","lesson":1,"type":"mc","label":"Câu 8","q":"Thế lực có âm mưu và hành động chống phá mục tiêu của nước ta trong sự nghiệp xây dựng và bảo vệ Tổ quốc được xác định là gì?","opts":["Thù địch của chúng ta.","Đối thủ của chúng ta.","Đối tượng của chúng ta.","Kẻ thù của chúng ta."],"a":2},{"id":"9","lesson":1,"type":"mc","label":"Câu 9","q":"Luật Biển Việt Nam quy định về đường cơ sở, các vùng biển, thềm lục địa, (……) thuộc chủ quyền, quyền chủ quyền, quyền tài phán quốc gia của Việt Nam.","opts":["Các đảo, quần đảo.","Các đảo, bán đảo và quần đảo.","Các đảo, quần đảo Hoàng Sa, quần đảo Trường Sa và bán đảo.","Các đảo, quần đảo Hoàng Sa, quần đảo Trường Sa và các quần đảo khác."],"a":3},{"id":"10","lesson":1,"type":"mc","label":"Câu 10","q":"Lãnh hải Việt Nam có chiều rộng tính từ đường cơ sở ra phía biển là bao nhiêu?","opts":["12 hải lý.","24 hải lý.","188 hải lý.","388 hải lý."],"a":0},{"id":"11","lesson":1,"type":"mc","label":"Câu 11","q":"Vùng đặc quyền kinh tế hợp với lãnh hải thành vùng biển có chiều rộng tính từ đường cơ sở là bao nhiêu?","opts":["212 hải lý.","200 hải lý.","224 hải lý.","350 hải lý."],"a":1},{"id":"12","lesson":1,"type":"mc","label":"Câu 12","q":"Ranh giới ngoài của thềm lục địa Việt Nam cách đường cơ sở không quá bao nhiêu hải lý, theo giới hạn tối đa được nêu trong luật?","opts":["212 hải lý.","200 hải lý.","224 hải lý.","350 hải lý."],"a":3},{"id":"13","lesson":1,"type":"mc","label":"Câu 13","q":"Khu vực biên giới trên không là phần không gian dọc theo biên giới quốc gia, có chiều rộng tính từ biên giới quốc gia trở vào là bao nhiêu?","opts":["25 km.","20 km.","15 km.","10 km."],"a":3},{"id":"14","lesson":1,"type":"tf","label":"Câu 14","ctx":"Đọc thông tin: Luật Biển Việt Nam quy định về đường cơ sở, nội thủy, lãnh hải, vùng tiếp giáp lãnh hải, vùng đặc quyền kinh tế, thềm lục địa, các đảo và quần đảo thuộc chủ quyền, quyền chủ quyền, quyền tài phán quốc gia của Việt Nam; hoạt động trong vùng biển Việt Nam; phát triển kinh tế biển; quản lý và bảo vệ biển, đảo. (Luật số 18/2012/QH13, thông qua ngày 21-6-2012, có hiệu lực từ ngày 01-01-2013).","sts":[{"t":"Lãnh hải có chiều rộng 12 hải lý tính từ đường cơ sở ra phía biển.","a":0},{"t":"Vùng tiếp giáp lãnh hải có chiều rộng 24 hải lý tính từ ranh giới ngoài của lãnh hải.","a":1},{"t":"Vùng đặc quyền kinh tế có chiều rộng 240 hải lý tính từ đường cơ sở.","a":1},{"t":"Ranh giới ngoài của thềm lục địa có thể được xác định đến giới hạn tối đa 350 hải lý tính từ đường cơ sở.","a":0}]},{"id":"15","lesson":1,"type":"tf","label":"Câu 15","ctx":"Kiên sống gần khu vực Ngã ba Đông Dương, thuộc xã Bờ Y. Một du khách đề nghị Kiên chỉ đường đi tắt qua biên giới sang Lào và Campuchia để chụp ảnh rồi quay lại. Hãy xác định đúng/sai:","sts":[{"t":"Kiên giải thích rằng qua lại trái phép biên giới quốc gia là hành vi bị nghiêm cấm.","a":0},{"t":"Kiên nhận lời vì chỉ sang chụp ảnh kỷ niệm thì không vi phạm.","a":1},{"t":"Kiên từ chối và hướng dẫn du khách thực hiện thủ tục xuất, nhập cảnh tại cửa khẩu được phép.","a":0},{"t":"Kiên nhận lời vì việc đó góp phần thu hút khách du lịch.","a":1}]},{"id":"16","lesson":1,"type":"tf","label":"Câu 16","ctx":"Minh cùng nhóm bạn đến tham quan khu vực biên giới trên đất liền. Minh định dùng flycam bay qua biên giới quốc gia trên không để chụp ảnh phía nước láng giềng. Hãy xác định đúng/sai:","sts":[{"t":"Tự ý điều khiển flycam bay qua biên giới quốc gia để ghi hình phía bên kia là hành vi không được phép.","a":0},{"t":"Tự ý cho flycam bay qua biên giới quốc gia trên không là hành vi bị nghiêm cấm.","a":0},{"t":"Có thể tự ý cho flycam bay qua biên giới nếu không chụp ảnh.","a":1},{"t":"Có thể tự ý bay qua biên giới để chụp phong cảnh, miễn là không ghi hình người hoặc công trình.","a":1}]},{"id":"17","lesson":1,"type":"tf","label":"Câu 17","ctx":"Trong một cuộc hội thảo về Luật Biển Việt Nam, một phóng viên đặt câu hỏi về các giới hạn và phạm vi chủ quyền của Việt Nam trên biển. Dựa vào tình huống trên, hãy xác định các nhận định sau là đúng hay sai:","sts":[{"t":"Vùng tiếp giáp lãnh hải là vùng biển tiếp liền và nằm ngoài lãnh hải Việt Nam, có chiều rộng 12 hải lý tính từ ranh giới ngoài của lãnh hải.","a":0},{"t":"Ranh giới ngoài của thềm lục địa cách đường cơ sở không quá 200 hải lý.","a":1},{"t":"Việt Nam có quyền xây dựng các đảo nhân tạo và công trình khác trong vùng đặc quyền kinh tế để phục vụ mục đích kinh tế.","a":0},{"t":"Tàu thuyền của tất cả các quốc gia được hưởng quyền đi qua không gây hại trong lãnh hải Việt Nam. Đối với tàu quân sự nước ngoài khi thực hiện quyền đi qua không gây hại trong lãnh hải Việt Nam, cũng không cần thông báo trước cho cơ quan có thẩm quyền của Việt Nam.","a":1}]},{"id":"18","lesson":2,"type":"mc","label":"Câu 18","q":"Công dân trong độ tuổi thực hiện nghĩa vụ quân sự, không phân biệt (……), phải thực hiện nghĩa vụ quân sự theo quy định của pháp luật.","opts":["Dân tộc, thành phần xã hội, tín ngưỡng, tôn giáo, trình độ học vấn.","Dân tộc, thành phần xã hội, tín ngưỡng, tôn giáo, trình độ học vấn, nghề nghiệp.","Dân tộc, thành phần xã hội, tín ngưỡng, tôn giáo, trình độ học vấn, nghề nghiệp, nơi cư trú.","Dân tộc, thành phần xã hội, tín ngưỡng, tôn giáo, trình độ học vấn, nghề nghiệp, nơi cư trú, nơi làm việc"],"a":2},{"id":"19","lesson":2,"type":"mc","label":"Câu 19","q":"Trường hợp nào sau đây đủ điều kiện đăng ký nghĩa vụ quân sự theo quy định?","opts":["Công dân nam đủ 17 tuổi đang bị truy cứu trách nhiệm hình sự.","Công dân nam đủ 17 tuổi đang chấp hành hình phạt quản chế.","Công dân nam đủ 17 tuổi đã chấp hành xong hình phạt tù nhưng chưa được xóa án tích.","Công dân nam đủ 17 tuổi đã chấp hành xong quyết định áp dụng biện pháp giáo dục tại cấp xã và có giấy chứng nhận theo quy định."],"a":3},{"id":"20","lesson":2,"type":"mc","label":"Câu 20","q":"Hằng năm, Chủ tịch UBND cấp xã quyết định gọi công dân đăng ký nghĩa vụ quân sự lần đầu vào tháng nào?","opts":["Tháng Hai.","Tháng Ba.","Tháng Tư.","Tháng Năm."],"a":2},{"id":"21","lesson":2,"type":"mc","label":"Câu 21","q":"Công dân thực hiện đăng ký nghĩa vụ quân sự lần đầu tại cơ quan nào theo quy định?","opts":["Tổ dân phố hoặc thôn.","Ban Chỉ huy quân sự cấp xã.","Ban Chỉ huy quân sự cấp tỉnh.","Nhà trường nơi đang học."],"a":1},{"id":"22","lesson":2,"type":"mc","label":"Câu 22","q":"Công dân nam được gọi nhập ngũ khi đủ bao nhiêu tuổi?","opts":["17 tuổi.","18 tuổi.","19 tuổi.","20 tuổi."],"a":1,"ex":"Đủ 17 tuổi là đăng ký nghĩa vụ quân sự lần đầu; đủ 18 tuổi mới được gọi nhập ngũ (độ tuổi gọi nhập ngũ từ đủ 18 đến hết 25 tuổi) – Điều 30 Luật Nghĩa vụ quân sự 2015."},{"id":"23","lesson":2,"type":"mc","label":"Câu 23","q":"Độ tuổi gọi nhập ngũ thông thường của công dân là:","opts":["Từ đủ 17 tuổi đến hết 25 tuổi.","Từ đủ 17 tuổi đến hết 27 tuổi.","Từ đủ 18 tuổi đến hết 25 tuổi.","Từ đủ 18 tuổi đến hết 27 tuổi."],"a":2},{"id":"24","lesson":2,"type":"mc","label":"Câu 24","q":"Công dân được tạm hoãn gọi nhập ngũ vì học cao đẳng, đại học thì độ tuổi gọi nhập ngũ có thể kéo dài đến hết:","opts":["25 tuổi.","26 tuổi.","27 tuổi.","28 tuổi."],"a":2},{"id":"25","lesson":2,"type":"mc","label":"Câu 25","q":"Hằng năm, công dân thuộc diện gọi nhập ngũ được gọi khám sức khỏe trong khoảng thời gian nào theo quy định hiện hành được nêu trong tài liệu học tập?","opts":["Từ ngày 01-10 đến hết ngày 30-11.","Từ ngày 01-11 đến hết ngày 30-11.","Từ ngày 01-11 đến hết ngày 31-12.","Từ ngày 01-12 đến hết ngày 31-12."],"a":2},{"id":"26","lesson":2,"type":"mc","label":"Câu 26","q":"Công dân là con của bệnh binh hoặc người nhiễm chất độc da cam suy giảm khả năng lao động từ mức nào thuộc diện tạm hoãn gọi nhập ngũ theo quy định được nêu trong tài liệu?","opts":["Từ 21% đến 40%.","Từ 41% đến 60%.","Từ 61% đến 80%.","Từ 81% trở lên."],"a":2},{"id":"27","lesson":2,"type":"mc","label":"Câu 27","q":"Công dân là một con của bệnh binh suy giảm khả năng lao động từ mức nào thuộc diện miễn gọi nhập ngũ theo quy định?","opts":["Từ 61% trở lên.","Từ 81% trở lên.","Từ 41% trở lên.","Từ 21% trở lên."],"a":1},{"id":"28","lesson":2,"type":"mc","label":"Câu 28","q":"Công dân là một con của người nhiễm chất độc da cam suy giảm khả năng lao động từ mức nào thuộc diện miễn gọi nhập ngũ theo quy định?","opts":["Từ 81% trở lên.","Từ 61% trở lên.","Từ 41% trở lên.","Từ 21% trở lên."],"a":0},{"id":"29","lesson":2,"type":"mc","label":"Câu 29","q":"Dân quân thường trực được công nhận hoàn thành nghĩa vụ quân sự tại ngũ trong thời bình khi có ít nhất bao nhiêu tháng phục vụ?","opts":["48 tháng.","36 tháng.","24 tháng.","18 tháng."],"a":2},{"id":"30","lesson":2,"type":"mc","label":"Câu 30","q":"Công dân hoàn thành nhiệm vụ tham gia Công an xã liên tục từ đủ bao nhiêu tháng trở lên có thể được công nhận hoàn thành nghĩa vụ quân sự tại ngũ trong thời bình theo quy định tương ứng?","opts":["60 tháng.","48 tháng.","36 tháng.","24 tháng."],"a":2},{"id":"31","lesson":2,"type":"mc","label":"Câu 31","q":"Công dân phục vụ trên tàu kiểm ngư từ đủ bao nhiêu tháng trở lên có thể được công nhận hoàn thành nghĩa vụ quân sự tại ngũ trong thời bình?","opts":["48 tháng.","42 tháng.","36 tháng.","24 tháng."],"a":3},{"id":"32","lesson":2,"type":"mc","label":"Câu 32","q":"Thời hạn phục vụ tại ngũ trong thời bình của hạ sĩ quan, binh sĩ là bao lâu?","opts":["12 tháng.","18 tháng.","24 tháng.","30 tháng."],"a":2},{"id":"33","lesson":2,"type":"mc","label":"Câu 33","q":"Trong trường hợp cần thiết vì lý do quốc phòng, an ninh, thời hạn phục vụ tại ngũ của hạ sĩ quan, binh sĩ có thể được kéo dài nhưng không quá bao lâu?","opts":["3 tháng.","6 tháng.","9 tháng.","12 tháng."],"a":1},{"id":"34","lesson":2,"type":"mc","label":"Câu 34","q":"Công dân nữ trong độ tuổi gọi nhập ngũ đã đăng ký nghĩa vụ quân sự, có chuyên môn phù hợp với yêu cầu của Công an nhân dân, (……) thì thuộc đối tượng tuyển chọn thực hiện nghĩa vụ tham gia Công an nhân dân.","opts":["Nếu tự nguyện.","Nếu Công an nhân dân có nhu cầu.","Nếu tự nguyện và Công an nhân dân có nhu cầu.","Nếu tự nguyện và Công an nhân dân yêu cầu."],"a":2},{"id":"35","lesson":2,"type":"mc","label":"Câu 35","q":"Độ tuổi tuyển chọn và ngành, nghề cần thiết để tuyển chọn công dân nữ thực hiện nghĩa vụ tham gia Công an nhân dân do ai quy định?","opts":["Bộ trưởng Bộ Công an.","Cục trưởng Cục Tổ chức cán bộ Bộ Công an.","Bộ trưởng Bộ Quốc phòng.","Bộ trưởng Bộ Nội vụ."],"a":0},{"id":"36","lesson":2,"type":"mc","label":"Câu 36","q":"Hồ sơ tuyển chọn công dân thực hiện nghĩa vụ tham gia Công an nhân dân gồm những giấy tờ nào theo quy định được nêu trong tài liệu?","opts":["Tờ khai đăng ký thực hiện nghĩa vụ tham gia Công an nhân dân; phiếu tự khai sức khỏe nghĩa vụ quân sự.","Tờ khai đăng ký thực hiện nghĩa vụ tham gia Công an nhân dân; giấy chứng nhận đăng ký nghĩa vụ quân sự.","Tờ khai đăng ký thực hiện nghĩa vụ tham gia Công an nhân dân; giấy chứng nhận đăng ký nghĩa vụ quân sự; bản chụp căn cước hoặc giấy tờ nhân thân hợp lệ.","Giấy chứng nhận đăng ký nghĩa vụ quân sự; phiếu tự khai sức khỏe; bản chụp giấy tờ nhân thân."],"a":1},{"id":"37","lesson":2,"type":"mc","label":"Câu 37","q":"Việc gọi sơ tuyển, khám sức khỏe và quyết định gọi từng công dân thực hiện nghĩa vụ tham gia Công an nhân dân do cơ quan hoặc người có thẩm quyền nào quyết định theo quy định hiện hành?","opts":["Chủ tịch UBND cấp xã.","Giám đốc Công an cấp tỉnh.","Chủ tịch UBND cấp tỉnh.","Trưởng Công an cấp xã."],"a":0},{"id":"38","lesson":2,"type":"tf","label":"Câu 38","ctx":"Quân là thành viên đội bóng rổ của lớp. Ngày thi đấu trận chung kết trùng với ngày ghi trong quyết định gọi khám sức khỏe nghĩa vụ quân sự. Quân phân vân vì muốn dự thi đấu rồi hôm sau mới đi khám. Hãy xác định đúng/sai:","sts":[{"t":"Lịch thi đấu đã được xếp trước nên đương nhiên là lý do chính đáng để vắng mặt khi khám sức khỏe.","a":1},{"t":"Tự ý đi khám sức khỏe chậm một ngày mà không có lý do chính đáng là hành vi vi phạm quy định về nghĩa vụ quân sự.","a":0},{"t":"Quân cần chấp hành thời gian khám ghi trong quyết định; nếu có lý do cần điều chỉnh, phải báo ngay cơ quan có thẩm quyền và thực hiện theo hướng dẫn.","a":0},{"t":"Quân có thể tự quyết định dự thi đấu rồi hôm sau đến khám mà không cần thông báo.","a":1}]},{"id":"39","lesson":2,"type":"tf","label":"Câu 39","ctx":"Lâm và Huy cùng được gọi nhập ngũ. Trước ngày giao, nhận quân, Lâm bị trượt ngã, bong gân nặng, không thể đi lại. Huy đề nghị cả hai cùng xin hoãn. Hãy xác định đúng/sai:","sts":[{"t":"Lâm đương nhiên được tạm hoãn nhập ngũ chỉ vì bị tai nạn, không cần xác minh hoặc quyết định của cơ quan có thẩm quyền.","a":1},{"t":"Nếu tình trạng tai nạn, sức khỏe khiến Lâm không thể có mặt đúng thời gian, địa điểm, Lâm hoặc gia đình cần khẩn trương thông báo và cung cấp giấy tờ y tế để cơ quan có thẩm quyền xem xét.","a":0},{"t":"Trong một năm, việc gọi nhập ngũ thường được tổ chức nhiều đợt tùy ý ở mọi địa phương.","a":1},{"t":"Lâm nên liên hệ Ban Chỉ huy quân sự cấp xã hoặc cơ quan ghi trong quyết định, đồng thời cung cấp giấy xác nhận y tế; không tự ý bỏ chấp hành quyết định.","a":0}]},{"id":"40","lesson":2,"type":"tf","label":"Câu 40","ctx":"Bạn Lan muốn tìm hiểu về các tiêu chuẩn để được tạm hoãn và miễn gọi nhập ngũ theo Luật Nghĩa vụ quân sự. Hãy xác định các nhận định sau là đúng hay sai:","sts":[{"t":"Công dân nam đủ 17 tuổi phải thực hiện đăng ký nghĩa vụ quân sự lần đầu.","a":0},{"t":"Chỉ công dân bị bệnh hiểm nghèo mới được miễn gọi nhập ngũ.","a":1},{"t":"Việc tạm hoãn gọi nhập ngũ đối với sinh viên đang học đại học hệ chính quy được thực hiện nhằm bảo đảm nguồn nhân lực có trình độ cao cho đất nước.","a":0},{"t":"Một học sinh đang học lớp 12, chưa đủ 18 tuổi nhưng đã có giấy báo gọi nhập ngũ nên viết đơn xin tạm hoãn ngay lập tức.","a":1}]},{"id":"41","lesson":3,"type":"mc","label":"Câu 41","q":"Một trong những cách thức hoạt động phổ biến của tội phạm là:","opts":["Hoạt động độc lập, không có sự cấu kết.","Câu kết thành các băng nhóm, tổ chức để hoạt động.","Chỉ lưu động trên phạm vi xã, phường.","Không sử dụng các loại vũ khí, công cụ."],"a":1},{"id":"42","lesson":3,"type":"mc","label":"Câu 42","q":"“Hiện tượng xã hội tiêu cực, biểu hiện bằng hành vi lệch chuẩn mực xã hội, vi phạm đạo đức, pháp luật và gây nguy hiểm cho xã hội” là nội dung của khái niệm nào sau đây?","opts":["Tệ nạn xã hội.","Bạo lực gia đình.","Bạo lực học đường.","Tội phạm hình sự."],"a":0},{"id":"43","lesson":3,"type":"mc","label":"Câu 43","q":"Tệ nạn ma túy là các hành vi nào?","opts":["Tình trạng một hoặc nhiều người sử dụng trái phép chất ma túy, nghiện ma túy và các hành vi vi phạm pháp luật về ma túy nhưng chưa đến mức hoặc không bị truy cứu trách nhiệm hình sự.","Mua dâm, bán dâm và các hành vi khác có liên quan đến mua dâm, bán dâm.","Tin vào những điều mơ hồ dẫn đến cuồng tín, hành động trái với chuẩn mực xã hội.","Lợi dụng trò chơi để cá cược, sát phạt được thua bằng tiền hoặc lợi ích vật chất khác."],"a":0},{"id":"44","lesson":3,"type":"mc","label":"Câu 44","q":"Các hành vi nhằm thực hiện dịch vụ quan hệ tình dục có tính chất mua bán trên cơ sở một giá trị vật chất nhất định ngoài phạm vi hôn nhân là nội dung của khái niệm nào sau đây?","opts":["Tệ nạn ma túy.","Tệ nạn mại dâm.","Tệ nạn cờ bạc.","Tệ nạn mê tín dị đoan."],"a":1},{"id":"45","lesson":3,"type":"mc","label":"Câu 45","q":"Các hành vi lợi dụng hình thức vui chơi, giải trí để cá cược, sát phạt nhau bằng tiền hoặc hiện vật mà không được cơ quan nhà nước có thẩm quyền cho phép là nội dung của khái niệm nào sau đây?","opts":["Tệ nạn ma túy.","Tệ nạn mại dâm.","Tệ nạn cờ bạc.","Tệ nạn mê tín dị đoan."],"a":2},{"id":"46","lesson":3,"type":"mc","label":"Câu 46","q":"Các hành vi biểu hiện lòng tin mù quáng vào những điều huyền bí, không có thật, dẫn đến suy đoán khác thường, cuồng tín và hành động trái với chuẩn mực xã hội, không phù hợp với quy luật tự nhiên, là nội dung của khái niệm nào sau đây?","opts":["Tệ nạn ma túy.","Tệ nạn mại dâm.","Tệ nạn cờ bạc.","Tệ nạn mê tín dị đoan."],"a":3},{"id":"47","lesson":3,"type":"mc","label":"Câu 47","q":"Hành vi đánh bạc trái phép chưa đến mức truy cứu trách nhiệm hình sự sẽ bị xử phạt theo hình thức nào sau đây?","opts":["Phạt cải tạo không giam giữ.","Xử phạt vi phạm hành chính.","Phạt tù có thời hạn.","Phạt tù chung thân."],"a":1},{"id":"48","lesson":3,"type":"mc","label":"Câu 48","q":"Nội dung nào sau đây không phản ánh đúng trách nhiệm của công dân trong việc phòng, chống tệ nạn xã hội và tội phạm sử dụng công nghệ cao?","opts":["Tham gia các hoạt động tuyên truyền, vui chơi lành mạnh.","Chủ động nghiên cứu và thực hiện nghiêm túc quy định của pháp luật.","Giúp đỡ cơ quan chức năng điều tra, xử lý các hành vi vi phạm pháp luật.","Không tham gia hoạt động phòng, chống tệ nạn xã hội do địa phương tổ chức."],"a":3},{"id":"49","lesson":3,"type":"mc","label":"Câu 49","q":"Hành vi nào sau đây bị nghiêm cấm trong phòng, chống tội phạm sử dụng công nghệ cao?","opts":["Sản xuất, mua bán, trao đổi hoặc tặng thiết bị, phần mềm để sử dụng trái pháp luật.","Đẩy nhanh việc ứng dụng, nghiên cứu, làm chủ và tạo ra công nghệ cao.","Hình thành và phát triển một số ngành công nghiệp công nghệ cao.","Nâng cao năng lực cạnh tranh, tham gia vào những khâu có giá trị gia tăng cao trong hệ thống cung ứng toàn cầu."],"a":0},{"id":"50","lesson":3,"type":"mc","label":"Câu 50","q":"Hôm nay nghỉ học, K rủ một số bạn đến nhà đánh tú lơ khơ ăn tiền. Nếu nhận được lời mời của K, em nên lựa chọn cách ứng xử nào sau đây?","opts":["Lập tức đồng ý đến nhà K chơi đánh bài ăn tiền.","Từ chối nhưng vẫn đến nhà K để xem các bạn chơi.","Từ chối và khuyên K không nên thực hiện hành vi đó.","Đồng ý và rủ thêm các bạn khác cùng tham gia cho vui."],"a":2},{"id":"51","lesson":3,"type":"tf","label":"Câu 51","ctx":"Trong một buổi ngoại khóa về phòng, chống tội phạm, học sinh được cung cấp thông tin về tội phạm sử dụng công nghệ cao và tệ nạn xã hội hiện nay. Hãy xác định các nhận định sau là đúng hay sai:","sts":[{"t":"Tội phạm là hành vi nguy hiểm cho xã hội, được quy định trong Bộ luật Hình sự.","a":0},{"t":"Tội phạm sử dụng công nghệ cao luôn nhắm vào các tổ chức tài chính lớn và ngân hàng.","a":1},{"t":"Tệ nạn xã hội luôn là tiền đề trực tiếp dẫn đến tội phạm hình sự.","a":1},{"t":"Việc tham gia vào các nhóm kín trên mạng xã hội để mua bán tài liệu học tập sao chép, dù không phải ma túy hay vũ khí, vẫn có thể bị coi là hành vi vi phạm pháp luật về sở hữu trí tuệ.\n|","a":0}]}];
const Q_TIN=[{"id":"t1","lesson":1,"type":"mc","label":"Câu 1","q":"Hệ điều hành là nơi?","opts":["Phần cứng khai thác hiệu quả của phần mềm","Phần mềm ứng dụng khai thác hiệu quả phần cứng","Giúp con người liên lạc với nhau","Các ứng dụng được sử dụng như một công cụ chèn"],"a":1},{"id":"t2","lesson":1,"type":"mc","label":"Câu 2","q":"Cơ chế \"plug & play\" giúp hệ điều hành?","opts":["Nhận biết thiết bị ngoại vi và hỗ trợ cài đặt các chương trình điều khiển một cách thụ động","Nhận biết thiết bị nội hàm và hỗ trợ cài đặt các chương trình điều khiển một cách tự động","Xóa bỏ thiết bị ngoại vi và hỗ trợ cài đặt các chương trình điều khiển một cách tự động","Nhận biết thiết bị ngoại vi và hỗ trợ cài đặt các chương trình điều khiển một cách tự động"],"a":3},{"id":"t3","lesson":1,"type":"mc","label":"Câu 3","q":"Hệ điều hành máy tính cá nhân phát triển cơ chế nào để tự động nhận biết thiết bị ngoại vi khi khởi động máy tính?","opts":["plug & play","plug & done","plug & win","win & done"],"a":0},{"id":"t4","lesson":1,"type":"mc","label":"Câu 4","q":"Tiêu chí quan trọng nhất đối với máy tính cá nhân dành cho người dùng phổ thông là?","opts":["Đắt đỏ và khó tiếp cận","Chỉ xử lý được một phần của vấn đề","Phức tạp hóa vấn đề","Thân thiện và dễ sử dụng"],"a":3},{"id":"t5","lesson":2,"type":"mc","label":"Câu 5","q":"Em có thể sử dụng tiện ích của File Explorer của Windows để?","opts":["Truy cập nhanh các phần mềm ứng dụng","Quản lý tệp và thư mục","Quan sát trạng thái hiển thị","Đáp án khác"],"a":1},{"id":"t6","lesson":2,"type":"mc","label":"Câu 6","q":"Để làm xuất hiện bảng chọn các lệnh có thể thực hiện với tệp thì ta phải?","opts":["Nháy nút trái chuột","Nháy đúp chuột","Nháy nút phải chuột","Đáp án khác"],"a":2},{"id":"t7","lesson":2,"type":"mc","label":"Câu 7","q":"Tiện ích là?","opts":["Một phần mềm đa năng","Một tệp chứa nhiều tệp con","Những công cụ hỗ trợ nhiều công việc khác nhau","Phần mềm ứng dụng"],"a":2},{"id":"t8","lesson":2,"type":"mc","label":"Câu 8","q":"Đĩa cứng là?","opts":["Là đĩa kim loại chứa phần mềm","Loại đĩa kim loại phủ vật liệu từ tính","Là đĩa kim loại chứa các tiện ích","Đáp án khác"],"a":1},{"id":"t9","lesson":3,"type":"mc","label":"Câu 9","q":"Phần mềm nguồn mở là?","opts":["Phần mềm cung cấp cả mã nguồn để người dùng có thể tự sửa đổi, cải tiến, phát triển","Là một phần mềm không được cung cấp mã nguồn mà sử dụng theo 1 chiều của mà sản xuất","Phần mềm bán lẻ nhất thế giới","Phần mềm có thể mở tất cả trương trình trên MacOS"],"a":0},{"id":"t10","lesson":3,"type":"mc","label":"Câu 10","q":"Phần mềm chạy trên internet là?","opts":["Phần mềm chỉ sử dụng cho các doanh nghiệp lớn","Phần mềm cần mua bản quyền để sử dụng","Phần mềm không cần có kết nối internet","Phần mềm sử dụng trực tiếp trên internet mà không cần cài đặt vào máy"],"a":3},{"id":"t11","lesson":3,"type":"mc","label":"Câu 11","q":"Cách thức chuyển giao phần mềm cho người sử dụng theo chiều hướng?","opts":["Ngăn dần","Đóng dần","Bí mật dần","Mở dần"],"a":3},{"id":"t12","lesson":3,"type":"mc","label":"Câu 12","q":"Phần mềm thương mại thường được dùng để?","opts":["Bán","Trao đổi","Tạo ra các chương trình mới lạ","Miễn phí"],"a":0},{"id":"t13","lesson":4,"type":"mc","label":"Câu 13","q":"CPU được cấu tạo từ hai bộ phận chính là?","opts":["Bộ số học và logic; Bộ điều khiển","Bộ điều khiển và bộ tính toán","Bộ điều khiển và bộ xóa","Bộ thư mục và bộ giải nén"],"a":0},{"id":"t14","lesson":4,"type":"mc","label":"Câu 14","q":"Bộ nhớ ngoài bao gồm?","opts":["Hệ thống phần mềm","Các loại đĩa từ, đĩa thể rắn hay đĩa quang","Các thanh công cụ chỉnh sửa","Quản trị phần mềm"],"a":1},{"id":"t15","lesson":4,"type":"mc","label":"Câu 15","q":"Bộ phận nào thực hiện tất cả các phép tính số học và logic trong máy tính?","opts":["Bộ điều khiển","Bộ nhớ trong","Bộ số học và logic","Bộ nhớ ROM"],"a":2},{"id":"t16","lesson":4,"type":"mc","label":"Câu 16","q":"Bộ phận nào phối hợp đồng bộ các thiết bị của máy tính, đảm bảo máy tính thực hiện đúng chương trình?","opts": 5","lesson":4,"type":"mc","label":"Bài 4 · Câu 14","q":"Sự kiện nào sau đây đã đánh dấu chủ nghĩa xã hội mở rộng ở khu vực Mỹ La - tinh?","opts":["Nước Cộng hoà Nhân dân Trung Hoa thành lập.","Nước Cộng hòa Ấn Độ thành lập.","Nước Cộng hoà Cu- ba thành lập.","Nước Cộng hòa Dân chủ Đức thành lập."],"a":2},{"id":"s56","lesson":4,"type":"mc","label":"Bài 4 · Câu 15","q":"Đưa đất nước thoát ra khỏi khủng hoảng kinh tế - xã hội và tình trạng kém phát triển năm 1986 Việt Nam đã","opts":["thực hiện cách mạng công nghiệp.","tiến hành đổi mới toàn diện đất nước.","cải cách bộ máy chính trị","quan hệ hợp tác với Mỹ."],"a":1},{"id":"s57","lesson":4,"type":"mc","label":"Bài 4 · Câu 16","q":"Quốc gia quyết tâm đi theo con đường xây dựng chủ nghĩa xã hội mặc dù bị cấm vận lâu dài của Mỹ và phương Tây là","opts":["Việt Nam.","Cu – ba.","Nga.","Hàn Quốc."],"a":1},{"id":"s58","lesson":4,"type":"mc","label":"Bài 4 · Câu 17","q":"Tháng 12 năm 1978 Trung Quốc đã thực hiện","opts":["công cuộc cải cách mở cửa.","cách mạng văn hoá.","đổi mới thể chế chính trị.","đối đầu với các nước tư bản."],"a":0},{"id":"s59","lesson":4,"type":"mc","label":"Bài 4 · Câu 18","q":"Trung Quốc về kinh tế, GDP từ vị trí thứ tám đã vươn lên vị trí nào hiện nay?","opts":["Thứ 5 thế giới.","Thứ 4 thế giới.","Thứ 3 thế giới.","Thứ 2 thế giới."],"a":3},{"id":"s60","lesson":4,"type":"mc","label":"Bài 4 · Câu 19","q":"Phát triển ngành hàng không vũ trụ Trung Quốc đã phóng được tàu","opts":["Châu Thần.","Thần Châu.","Quảng Châu.","Ung Châu."],"a":1},{"id":"s61","lesson":4,"type":"mc","label":"Bài 4 · Câu 20","q":"Về giáo dục, Trung Quốc thực hiện cải cách","opts":["ngắn hạn.","sách giáo khoa.","toàn diện.","phiến diện."],"a":2},{"id":"sf1","lesson":1,"type":"tf","label":"Bài 1 · Đúng/Sai câu 1","ctx":"Cách mạng tư sản Anh đặt dấu mốc cho sự xác lập chủ nghĩa tư bản ở Anh, thiết lập chế độ quân chủ lập hiến.... Chiến tranh giành độc lập của 13 thuộc địa Anh ở Bắc Mĩ đã giải phóng nhân dân các thuộc địa Anh khỏi ách thống trị thực dân, đưa đến sự thành lập nhà nước tư bản đầu tiên ở ngoài châu Âu…, Cách mạng tư sản Pháp đã xoá bỏ chế độ quân chủ chuyên chế, thiết lập nền dân chủ tư sản ” — Xác định các nhận định sau là đúng hay sai:","sts":[{"t":"Đoạn tư liệu trên nói đến kết quả của các cuộc cách mạng tư sản ở Anh, Pháp và 13 thuộc địa Anh ở Bắc Mỹ.","a":0},{"t":"Chiến tranh giành độc lập của 13 thuộc địa Anh ở Bắc Mĩ được xem là cuộc chiến tranh giải phóng dân tộc.","a":0},{"t":"Tất cả các cuộc cách mạng tư sản sau thắng lợi là thiết lập chế độ chủ nghĩa tư bản, mở đường cho kinh tế tư bản phát triển.","a":1},{"t":"Cách mạng tư sản Anh, Pháp, Mĩ thế kỉ XVII – XVIII đều lật đổ chế độ phong kiến, thiết lập chế độ quân chủ lập hiến.","a":1}]},{"id":"sf2","lesson":1,"type":"tf","label":"Bài 1 · Đúng/Sai câu 2","ctx":"Cách mạng tư sản Anh đặt dấu mốc cho sự xác lập chủ nghĩa tư bản ở Anh, thiết lập chế độ quân chủ lập hiến.... Chiến tranh giành độc lập của 13 thuộc địa Anh ở Bắc Mĩ đã giải phóng nhân dân các thuộc địa Anh khỏi ách thống trị thực dân, đưa đến sự thành lập nhà nước tư bản đầu tiên ở ngoài châu Âu…, Cách mạng tư sản Pháp đã xoá bỏ chế độ quân chủ chuyên chế, thiết lập nền dân chủ tư sản ” — Xác định các nhận định sau là đúng hay sai:","sts":[{"t":"Đoạn tư liệu trên nói đến kết quả của các cuộc cách mạng tư sản ở Anh, Nga và 13 thuộc địa Anh ở Bắc Mỹ.","a":1},{"t":"Chiến tranh giành độc lập của 13 thuộc địa Anh ở Bắc Mĩ diễn ra dưới hình thức nội chiến.","a":1},{"t":"Tất cả các cuộc cách mạng tư sản sau thắng lợi đã mở đường cho chủ nghĩa tư bản phát triển.","a":0},{"t":"Cách mạng tư sản Pháp cuối thế kỉ XVIII được đánh giá là cuộc cách mạng vĩ đại.","a":0}]},{"id":"sf3","lesson":1,"type":"tf","label":"Bài 1 · Đúng/Sai câu 3","ctx":"“Ở Pháp, vương quyền là đỉnh cao của lâu đài phong kiến và chuyên chế. Nhà vua luôn có quyền hành chuyên chế và vô hạn; … quyết định mọi công việc đối nội và đối ngoại của quốc gia. Triều vua Lu-I XVI là một sự chuyên chế cao độ. Theo những “mật lệnh có ấn vua” nhằm khủng bố nhân dân, hàng trăm người bị bắt, bị tù đày ở các nơi trong nước”. — Xác định các nhận định sau là đúng hay sai:","sts":[{"t":"Đoạn tư liệu trên nói đến chính sách cai trị của chế độ quân chủ chuyên chế dưới triều vua Lu-I XVI.","a":0},{"t":"Sự tồn tại của nhà nước quân chủ chuyên chế ở Pháp, gây bất mãn cho tầng lớp quý tộc mới.","a":1},{"t":"Mâu thuẫn giữa đẳng cấp thứ ba với đẳng cấp tăng lữ và quý tộc ngày càng sâu sắc.","a":0},{"t":"Đồng minh của giai cấp tư sản Pháp trong cách mạng năm 1789 là nông dân, công nhân và thợ thủ công.","a":0}]},{"id":"sf4","lesson":1,"type":"tf","label":"Bài 1 · Đúng/Sai câu 4","ctx":"Tư liệu 1: “Tất cả mọi người sinh ra có quyền bình đẳng. Tạo hóa cho họ những quyền không ai có thể xâm phạm được; trong những quyền ấy, có quyền được sống, quyền tự do và quyền mưu cầu hạnh phúc”. Tư liệu 2: “Điều 1. Con người sinh ra đều có quyền tự do và bình đẳng. Những sự phân biệt xã hội chỉ có thể dựa trên lợi ích chung. Điều 17. Quyền tư hữu là quyền bất khả xâm phạm và thiêng liêng không ai có thể bị tước bỏ” — Xác định các nhận định sau là đúng hay sai:","sts":[{"t":"Bản Tuyên ngôn Nhân quyền và Dân quyền ra đời từ cuộc cách mạng tư sản Pháp cuối thế kỉ XVIII.","a":0},{"t":"Điểm chung của Tuyên ngôn Độc lập của nước Mĩ và Tuyên ngôn Nhân quyền và Dân quyền của nước Pháp là đề cao quyền con người và quyền công dân.","a":0},{"t":"Bản Tuyên ngôn Nhân quyền và Dân quyền của nước Pháp năm 1789 không đề cao quyền tư hữu cá nhân.","a":1},{"t":"Trong Tuyên ngôn độc lập của nước Việt Nam dân chủ Cộng hòa (2/9/1945), Chủ tịch Hồ Chí Minh đã trích dẫn trong bản tuyên ngôn Độc lập của nước Mĩ và Tuyên ngôn Nhân quyền và Dân quyền của nước Pháp.","a":0}]},{"id":"sf5","lesson":1,"type":"tf","label":"Bài 1 · Đúng/Sai câu 5","ctx":"“Chiến tranh giành độc lập của 13 thuộc địa Anh ở Bắc Mĩ đã giải phóng nhân dân các thuộc địa Anh khỏi ách thống trị thực dân, đưa đến sự thành lập nhà nước tư sản đầu tiên ở ngoài châu Âu, thúc đẩy phong trào giải phóng dân tộc ở khu vực Mĩ Latinh phát triển và có ảnh hưởng tích cực đến phong trào giành độc lập ở nhiều nơi trên thế giới vào cuối thế kỉ XVIII – đầu thế kỉ XIX” — Xác định các nhận định sau là đúng hay sai:","sts":[{"t":"Chiến tranh giành độc lập của 13 thuộc địa Anh ở Bắc Mĩ thắng lợi, đánh dấu sự mở rộng của chủ nghĩa tư bản ở ngoài châu Âu.","a":0},{"t":"Chiến tranh giành độc lập của 13 thuộc địa Anh ở Bắc Mĩ là cuộc cách mạng tư sản vĩ đại và triệt để nhất trong các thế kỉ XVIII – XIX.","a":1},{"t":"Trong Chiến tranh giành độc lập của 13 thuộc địa Anh ở Bắc Mĩ và Cách mạng tư sản Anh lực lượng lãnh đạo là hoàn toàn giống nhau.","a":1},{"t":"Chiến tranh giành độc lập của 13 thuộc địa Anh ở Bắc Mĩ thắng lợi đã thúc đẩy phong trào đấu tranh giành độc lập ở khu vực Mỹ la – tinh.","a":0}]},{"id":"sf6","lesson":2,"type":"tf","label":"Bài 2 · Đúng/Sai câu 1","ctx":"Đầu thế kỉ XX, các tổ chức độc quyền ở Pháp, Mĩ, Anh chỉ chiếm khoảng 1% tổng số xí nghiệp toàn thế giới nhưng lại chiếm hơn 3/4 tổng số máy hơi nước và động cơ điện, số lượng công nhân; tổng số sản phẩm làm ra chiếm gần một nửa so với toàn thế giới. — Xác định các nhận định sau là đúng hay sai:","sts":[{"t":"Các tổ chức độc quyền chỉ được hình thành ở các nước Anh, Pháp, Mĩ.","a":1},{"t":"Đoạn trích là một minh chứng cho thấy các tổ chức độc quyền đã chi phối sự phát triển của toàn bộ nền kinh tế.","a":0},{"t":"Đầu thế kỉ XX các tổ chức độc quyền ở Pháp, Mĩ, Anh chiếm tỉ lệ gần như tuyệt đối số sản phẩm làm ra trên toàn thế giới.","a":1},{"t":"Chủ nghĩa tư bản chuyển từ tự do cạnh tranh sang độc quyền đây chính là sự kết hợp sức mạnh kinh tế của các tổ chức độc quyền tư nhân với sức mạnh chính trị của nhà nước tư bản.","a":0}]},{"id":"sf7","lesson":2,"type":"tf","label":"Bài 2 · Đúng/Sai câu 2","ctx":"Chủ nghĩa tư bản có ưu thế trong việc sử dụng những thành tựu của cuộc Cách mạng công nghiệp lần thứ tư để phát triển kinh tế. Các nước tư bản phát triển trở thành trung tâm kinh tế, tài chính, khoa học – công nghệ của thế giới, có quy mô nền kinh tế và thu nhập bình quân đầu người thuộc hàng cao nhất thế giới. — Xác định các nhận định sau là đúng hay sai:","sts":[{"t":"Đoạn tư liệu trên nói đến tiềm năng của các nước tư bản trong việc sử dụng thành tựu Cách mạng công nghiệp lần thứ tư để phát triển.","a":0},{"t":"Chủ nghĩa tư bản hiện đại không có khả năng tự điều chỉnh để tồn tại và phát triển.","a":1},{"t":"Việt Nam ngày càng mở rộng quan hệ hợp tác với nhiều nước trên thế giới trong lĩnh vực khoa học – công nghệ.","a":0},{"t":"Hiện nay trong xã hội của chủ nghĩa tư bản hiện đại cơ bản đã giải quyết được sự chênh lệch giàu nghèo.","a":1}]},{"id":"sf8","lesson":2,"type":"tf","label":"Bài 2 · Đúng/Sai câu 3","ctx":"Chủ nghĩa tư bản hiện đại đang phải đối mặt với nhiều thách thức. Thứ nhất, chủ nghĩa tư bản đang phải đối mặt và khó có thể giải quyết được những cuộc khủng hoảng kinh tế, tài chính mang tính toàn cầu. Thứ hai, chủ nghĩa tư bản đã và đang phải đối mặt và không thể giải quyết được những vấn đề chính trị, xã hội nan giải. Thứ ba, chủ nghĩa tư bản không có khả năng giải quyết triệt để các mâu thuẫn xã hội. Sự chênh lệch giàu nghèo làm sâu sắc thêm tình trạng bất bình đẳng trong xã hội. — Xác định các nhận định sau là đúng hay sai:","sts":[{"t":"Đoạn tư liệu trên nói đến những thách thức của chủ nghĩa tư bản hiện đại.","a":0},{"t":"Hiện nay các mâu thuẫn xã hội ở các tư bản cơ bản đã được giải quyết triệt để.","a":1},{"t":"Khủng hoảng năng lượng tiếp tục gây ra nhiều tác động tiêu cực đến các nước tư bản.","a":0},{"t":"Bản chất của chủ nghĩa tư bản hiện đại ngày nay đã thay đổi.","a":1}]},{"id":"sf9","lesson":2,"type":"tf","label":"Bài 2 · Đúng/Sai câu 4","ctx":"Chủ nghĩa tư bản có ưu thế trong việc sử dụng những thành tựu của cuộc cách mạng công nghiệp lần thứ tư để phát triển kinh tế. Chủ nghĩa tư bản đang phải đối mặt và khó có thể giải quyết được những cuộc khủng hoảng kinh tế, tài chính mang tính toàn cầu. Chủ nghĩa tư bản đã và đang phải đối mặt và không thể giải quyết được những vấn đề chính trị, xã hội nan giải. Chủ nghĩa tư bản không có khả năng giải quyết triệt để các mâu thuẫn xã hội. Sự chênh lệch giàu nghèo làm sâu sắc thêm tình trạng bất bình đẳng trong xã hội. — Xác định các nhận định sau là đúng hay sai:","sts":[{"t":"Đoạn tư liệu trên chỉ đề cập đến những thách thức của chủ nghĩa tư bản hiện đại.","a":1},{"t":"Hiện nay các mâu thuẫn xã hội ở các tư bản cơ bản đã được giải quyết triệt để.","a":1},{"t":"Khủng hoảng năng lượng tiếp tục gây ra nhiều tác động tiêu cực đến các nước tư bản.","a":0},{"t":"Bản chất của chủ nghĩa tư bản hiện đại ngày nay vẫn không thay đổi.","a":0}]},{"id":"sf10","lesson":3,"type":"tf","label":"Bài 3 · Đúng/Sai câu 1","ctx":"\"Sự ra đời của Liên bang Xô viết là một sự kiện quan trọng. Sức mạnh của Nhà nước Xô viết được củng cố và tăng cường. Đồng thời, đó là thắng lợi của chính sách dân tộc theo chủ nghĩa Lê-nin, của tình hữu nghị anh em giữa các dân tộc trong quốc gia công nông đầu tiên trên thế giới. Lần đầu tiên trong lịch sử, loài người tiến bộ đã được thấy một con đường giải phóng đúng đắn vấn đề dân tộc, đó là thủ tiêu mọi bất bình đẳng dân tộc và xây dựng một cộng đồng anh em giữa các dân tộc”. — Xác định các nhận định sau là đúng hay sai:","sts":[{"t":"Đoạn trích trên nói đến sự ra đời của Liên bang Xô viết là một sự kiện quan trọng.","a":0},{"t":"Sự ra đời của Liên bang Xô Viết đã báo hiệu sự sụp đổ hoàn toàn chế độ chủ nghĩa tư bản.","a":1},{"t":"Liên bang Xô Viết ra đời đã xác lập mô hình nhà nước kiểu mới đối lập với mô hình nhà nước tư bản chủ nghĩa.","a":0},{"t":"Sự ra đời của Liên bang Xô Viết đã chứng minh học thuyết Mác – Lê nin là đúng đắn, khoa học.","a":0}]},{"id":"sf11","lesson":3,"type":"tf","label":"Bài 3 · Đúng/Sai câu 2","ctx":"“Quá trình thành lập Liên bang cộng hòa xã hội chủ nghĩa Xô viết phù hợp với lợi ích chung của các dân tộc trên đất nước Xô viết. Sức mạnh của tình đoàn kết và sự hợp tác, giúp đỡ giữa các dân tộc tạo điều kiện cho sự phát triển nhanh chóng về kinh tế, xã hội của tất cả các nước Cộng hòa, đồng thời tăng cường vị thế của Liên Xô trên trường quốc tế. Sự thành lập Liên Xô dưới sự chỉ đạo của Lê nin đã mở ra con đường giải quyết đúng đắn vấn đề dân tộc trên đất nước Xô viết trên cơ sở bình đẳng và giúp đỡ lẫn nhau”. — Xác định các nhận định sau là đúng hay sai:","sts":[{"t":"Đoạn trích trên nói đến quá trình thành lập Liên bang cộng hòa xã hội chủ nghĩa Xô Viết phù hợp với lợi ích chung của các dân tộc trên đất nước Xô Viết.","a":0},{"t":"Tư tưởng chỉ đạo của Lê – nin trong việc thành lập Liên bang Cộng hoà Xô viết là sự bình đẳng về mọi mặt, quyền dân tộc tự quyết.","a":0},{"t":"Sự ra đời của nhà nước Liên Xô đã hình thành nên một trật tự thế giới mới trên thế giới.","a":1},{"t":"Liên Xô ra đời đã tạo tiền đề cho sự ra đời của hệ thống xã hội chủ nghĩa thế giới.","a":0}]},{"id":"sf12","lesson":3,"type":"tf","label":"Bài 3 · Đúng/Sai câu 3","ctx":"Sau thắng lợi Cách mạng tháng Mười Nga….. Đại hội Xô viết toàn nga lần thứ hai, khai mạc đêm 25 – 10 – 1917 tại Điện Xmô – nưi, ra tuyên bố thành lập Chính quyền Xô viết do Lê – nin đứng đầu. Trong cuộc chiến đấu chống thù trong giặc ngoài (1918 – 1921), các nước Cộng hoà xã hội chủ nghĩa trên đất nước Xô viết đã đoàn kết, giúp đỡ lẫn nhau để giữ vững chính quyền Xô viết. Ngày 30 -12- 1922, tại Mát – xcơ – va, dưới sự chỉ đạo trực tiếp của Lê – nin, Đại hội lần thứ nhất các Xô viết toàn Liên bang đã thông qua bản Tuyên ngôn thành lập Liên bang Cộng hoà xã hội chủ nghĩa Xô viết ( gọi tắt là Liên Xô). — Xác định các nhận định sau là đúng hay sai:","sts":[{"t":"Đoạn trích trên nói đến sự thành lập Chính quyền Xô viết do Lê – nin đứng đầu.","a":0},{"t":"Trong những năm ( 1918 – 1921) nhà nước Liên Xô đã chiến đấu chống thù trong giặc ngoài và giành thắng lợi.","a":1},{"t":"Đoạn tư liệu trên nói đến quá trình thành lập nhà nước Liên bang Cộng hoà xã hội chủ nghĩa Xô viết đã hoàn thành.","a":1},{"t":"Thắng lợi Cách mạng tháng Mười Nga có ảnh hưởng to lớn đến cách mạng Việt Nam.","a":0}]},{"id":"sf13","lesson":4,"type":"tf","label":"Bài 4 · Đúng/Sai câu 1","ctx":"Thắng lợi của Hồng quân Liên Xô trong việc tiêu diệt chủ nghĩa phát xít ở Châu Âu tạo điều kiện thuận lợi cho nhân dân các nước Đông Âu nổi dậy giành chính quyền, thành lập nhà nước dân chủ nhân dân. Sau khi thành lập chính quyền dân chủ nhân dân, các nước Đông Âu hoàn thành việc thực hiện nhiệm vụ của cách mạng dân chủ nhân dân: tiến hành cải cách ruộng đất, quốc hữu hoá các nhà máy, xí nghiệp của tư bản, thực hiện các quyền tự do, dân chủ... — Xác định các nhận định sau là đúng hay sai:","sts":[{"t":"Đoạn tư liệu trên nói đến thắng lợi của Hồng quân Liên Xô trong việc tiêu diệt chủ nghĩa phát xít ở châu Âu tạo điều kiện thuận lợi cho nhân dân các nước Đông Âu nổi dậy giành chính quyền.","a":0},{"t":"Việc tiêu diệt chủ nghĩa phát xít của Hồng quân Liên Xô là điều kiện khách quan dẫn đến thành công của các nước Đông Âu trong công cuộc cải cách ruộng đất.","a":1},{"t":"Quốc hữu hoá các nhà máy, xí nghiệp của tư bản là một trong các nhiệm vụ của cuộc cách mạng dân chủ nhân dân ở Đông Âu.","a":0},{"t":"Nhà nước dân chủ nhân dân của các nước Đông Âu được thành lập sau chiến tranh thế giới thứ hai.","a":0}]},{"id":"sf14","lesson":4,"type":"tf","label":"Bài 4 · Đúng/Sai câu 2","ctx":"Sau thắng lợi. của cách mạng Cu- ba năm 1959, nước Cộng hoà Cu - ba được thành lập. Chính phủ cách mạng đã tiến hành những cải cách dân chủ trên các lĩnh vực kinh tế, chính trị, xã hội. Từ năm 1961, Cu-ba bước vào thời kì xây dựng xã hội chủ nghĩa. Mặc dù phải đối mặt với nhiều khó khăn, thách thức, đặc biệt là chính sách cấm vận của Mỹ, nhưng nhân dân Cu - ba vẫn kiên định đi theo con đường xã hội chủ nghĩa. — Xác định các nhận định sau là đúng hay sai:","sts":[{"t":"Đoạn trích trên nói đến sau khi nước Cộng hoà Cu – ba ra đời, đã tiến hành các cải cách dân chủ.","a":0},{"t":"Sau khi thành lập, nước Cộng hoà Cu - ba bắt tay ngay vào công cuộc xây dựng chủ nghĩa xã hội.","a":1},{"t":"Những thành tựu của Cu - ba trong công cuộc xây dựng CNXH là nguồn cổ vũ các nước Mỹ-La-tinh đi lên xây dựng chủ nghĩa xã hội.","a":1},{"t":"Sau chiến tranh thế giới thứ hai, từng bước, chủ nghĩa xã hội đã mở rộng từ châu Âu sang châu Á, và ở khu vực Mĩ La - tinh.","a":0}]},{"id":"sf15","lesson":4,"type":"tf","label":"Bài 4 · Đúng/Sai câu 3","ctx":"Bảng thành tựu của công cuộc cải cách mở cửa ở Trung Quốc: Tháng 12-1978 – Trung Quốc thực hiện công cuộc cải cách mở cửa và đạt nhiều thành tựu to lớn. Về kinh tế – quy mô GDP từ vị trí thứ tám thế giới (những năm 80 của thế kỉ XX) vươn lên vị trí thứ hai thế giới (từ năm 2010). Về khoa học, công nghệ – phát triển ngành hàng không vũ trụ (phóng được tàu Thần Châu vào không gian). — Xác định các nhận định sau là đúng hay sai:","sts":[{"t":"Trung Quốc vươn lên vị trí kinh tế thứ hai thế giới (từ năm 2010) sau Mỹ.","a":0},{"t":"Những thành tựu kinh tế đạt được đã đưa Trung Quốc vươn lên bá chủ thế giới trong giai đoạn hiện nay.","a":1},{"t":"Những thành tựu đạt được của Trung Quốc trong công cuộc cải cách mở cửa, chứng tỏ sự đúng đắn của con đường xây dựng chủ nghĩa xã hội theo hướng chủ nghĩa tư bản.","a":1},{"t":"Thành tựu công cuộc cải cách mở cửa ở Trung Quốc để lại nhiều bài học kinh nghiệm cho Việt Nam.","a":0}]},{"id":"sf16","lesson":4,"type":"tf","label":"Bài 4 · Đúng/Sai câu 4","ctx":"Bảng thành tựu một số nước trong công cuộc xây dựng CNXH từ 1991 đến nay: Việt Nam – năm 1986 tiến hành công cuộc đổi mới đất nước, trở thành nước đang phát triển có thu nhập trung bình; những thành tựu to lớn về kinh tế, chính trị, xã hội khẳng định con đường đi lên chủ nghĩa xã hội phù hợp với thực tiễn Việt Nam. Lào – từ năm 1986 thực hiện đường lối đổi mới toàn diện theo định hướng xã hội chủ nghĩa; thực hiện thành công hai nhiệm vụ chiến lược: xây dựng, bảo vệ đất nước và hội nhập quốc tế. Cu-ba – từ năm 1991 thực hiện cải cách kinh tế từng bước, có chọn lọc; hệ thống giáo dục, y tế miễn phí luôn là ưu tiên hàng đầu. — Xác định các nhận định sau là đúng hay sai:","sts":[{"t":"Từ năm 1986 đến nay công cuộc đổi mới của ba nước Việt Nam, Lào, Cu-ba đạt nhiều thành tựu rực rỡ.","a":0},{"t":"Công cuộc đổi mới ở Việt Nam chỉ diễn ra trên lĩnh vực kinh tế và chính trị.","a":1},{"t":"Những thành tựu của công cuộc đổi mới ở Việt Nam, Lào, Cu-ba khẳng định con đường đi lên chủ nghĩa xã hội là phù hợp với thực tiễn và xu thế thời đại.","a":0},{"t":"Trên thế giới hiện nay chỉ còn Việt Nam và Cu-ba tiếp tục con đường chủ nghĩa xã hội.","a":1}]},{"id":"sf17","lesson":4,"type":"tf","label":"Bài 4 · Đúng/Sai câu 5","ctx":"Sau chiến tranh thế giới thứ hai, chủ nghĩa xã hội từ phạm vi một nước đã trở thành một hệ thống thế giới, trải dài từ châu Âu sang châu Á, lan tới vùng biển Ca-ri-bê thuộc khu vực Mỹ-la-tinh. Các nước xã hội chủ nghĩa ngày càng phát triển và lớn mạnh, có vị trí quan trọng trên thế giới. — Xác định các nhận định sau là đúng hay sai:","sts":[{"t":"Hệ thống chủ nghĩa xã hội trên thế giới được hình thành sau chiến tranh thế giới thứ hai.","a":0},{"t":"Sau chiến tranh thế giới thứ hai trong quan hệ quốc tế chỉ tồn tại duy nhất hệ thống xã hội chủ nghĩa.","a":1},{"t":"Những thành tựu của các nước XHCN đã khẳng định tính ưu việt của CNXH.","a":0},{"t":"Sự lớn mạnh của hệ thống XHCN đã làm thất bại hoàn toàn âm mưu thiết lập trật tự thế giới đơn cực của Mỹ sau chiến tranh thế giới thứ hai.","a":1}]}];

{2} = 10. Cơ năng của con lắc bao nhiêu J?","ans":0.4,"tol":0.001,"unit":"J","ex":"W = \\frac{1}{2}mω^{2}A^{2} = \\frac{1}{2}·0,2·20^{2}·0,1^{2} = 0,4 J."},{"id":"vs5","lesson":1,"type":"sh","label":"Phần III · Câu 5","q":"Con lắc lò xo có khối lượng m = 400 gam, độ cứng k = 160 N/m dao động điều hoà theo phương thẳng đứng. Biết khi vật có li độ 0,02 m thì vận tốc của vật bằng 0,4 m/s. Năng lượng dao động của vật là bao nhiêu mJ?","ans":64,"tol":0.01,"unit":"mJ","ex":"ω = \\sqrt{\\frac{k}{m}} = 20 rad/s; A^{2} = x^{2} + \\frac{v^{2}}{ω^{2}} = 8·10^{−4} m^{2}; W = \\frac{1}{2}kA^{2} = 0,064 J = 64 mJ."},{"id":"vs6","lesson":1,"type":"sh","label":"Phần III · Câu 6","q":"Một chất điểm dao động với phương trình x = 8cos(5t) cm (t tính bằng s). Tốc độ của chất điểm khi đi qua vị trí cân bằng là bao nhiêu m/s? (kết quả đến chữ số hàng phần mười)","ans":0.4,"tol":0.005,"unit":"m/s","ex":"v_{max} = ωA = 5·8 = 40 cm/s = 0,4 m/s."},{"id":"vs7","lesson":1,"type":"sh","label":"Phần III · Câu 7","q":"Một con lắc lò xo gồm vật nặng có khối lượng 100 g và lò xo có độ cứng 100 N/m đang dao động điều hòa với biên độ 6 cm. Chu kì dao động của con lắc là bao nhiêu giây? (Làm tròn đến hàng phần mười)","ans":0.2,"tol":0.005,"unit":"s","ex":"T = 2π\\sqrt{\\frac{m}{k}} = 2π\\sqrt{\\frac{0,1}{100}} ≈ 0,199 ≈ 0,2 s."}];

ary · Câu 5", "q": "Living in three- or four-generational families, commonly referred to as \"________ families,\" has both benefits and drawbacks.", "opts": ["single-parent", "extended", "nuclear", "crowded"], "a": 1}, {"id": "v6", "lesson": 2, "type": "mc", "label": "Vocabulary · Câu 6", "q": "Mr. John is an engineer and expects his son to follow ________ his footsteps.", "opts": ["up", "on", "in", "at"], "a": 2}, {"id": "v7", "lesson": 2, "type": "mc", "label": "Vocabulary · Câu 7", "q": "Antibiotics are not used in the ________ of diseases caused by viruses.", "opts": ["treatment", "treated", "treat", "treatable"], "a": 0}, {"id": "v8", "lesson": 2, "type": "mc", "label": "Vocabulary · Câu 8", "q": "While smoking and fast food consumption can increase the risk of obesity, doing regular ________ activity can help people have a good shape.", "opts": ["mental", "physical", "daily", "extracurricular"], "a": 1}, {"id": "v9", "lesson": 2, "type": "mc", "label": "Vocabulary · Câu 9", "q": "About 50,000 bicyclists suffer ________ serious head injuries each year.", "opts": ["at", "about", "on", "from"], "a": 3}, {"id": "v10", "lesson": 2, "type": "mc", "label": "Vocabulary · Câu 10", "q": "My father and I have many ________ characteristics. People say that I take after him.", "opts": ["usual", "common", "physical", "generational"], "a": 1}, {"id": "v11", "lesson": 2, "type": "mc", "label": "Vocabulary · Câu 11", "q": "A balanced ________ means eating a selection of different foods, with no one type predominating.", "opts": ["diet", "view", "coverage", "approach"], "a": 0}, {"id": "v12", "lesson": 2, "type": "mc", "label": "Vocabulary · Câu 12", "q": "Younger generations tend to use ________ more frequently than older generations.", "opts": ["life expectancy", "cycle path", "city dweller", "social media"], "a": 3}, {"id": "v13", "lesson": 2, "type": "mc", "label": "Vocabulary · Câu 13", "q": "Many people find it challenging to ________ bad habits, even when they are aware of the negative consequences.", "opts": ["turn down", "give up", "grow up", "close down"], "a": 1}, {"id": "v14", "lesson": 2, "type": "mc", "label": "Vocabulary · Câu 14", "q": "________ is a defining trait of GenZ, as they prioritise personal autonomy and independence in shaping their identities and making life choices.", "opts": ["Individualism", "Individual", "Individualise", "Individually"], "a": 0}, {"id": "v15", "lesson": 2, "type": "mc", "label": "Vocabulary · Câu 15", "q": "In smart cities, AI technologies will be installed to help the city ________ more efficiently.", "opts": ["exhibit", "design", "operate", "impress"], "a": 2}, {"id": "v16", "lesson": 2, "type": "mc", "label": "Vocabulary · Câu 16", "q": "She found herself ________ conflict with her parents over her future career.", "opts": ["in", "out", "for", "on"], "a": 0}, {"id": "v17", "lesson": 2, "type": "mc", "label": "Vocabulary · Câu 17", "q": "Watching TV too much may ________ to sleep and weight problems.", "opts": ["cause", "lead", "result", "arrive"], "a": 1}, {"id": "v18", "lesson": 2, "type": "mc", "label": "Vocabulary · Câu 18", "q": "My parents always complain ________ my clothes and hairstyle.", "opts": ["about", "in", "of", "For"], "a": 0}, {"id": "v19", "lesson": 2, "type": "mc", "label": "Vocabulary · Câu 19", "q": "Songdo is special. It gives city ________ something new they have never had before.", "opts": ["inhabit", "inhabitants", "inhabitable", "inhabited"], "a": 1}, {"id": "v20", "lesson": 2, "type": "mc", "label": "Vocabulary · Câu 20", "q": "A traditional view is that men are the ________ in the family.", "opts": ["housewives", "housekeepers", "keys", "breadwinners"], "a": 3}, {"id": "v21", "lesson": 2, "type": "mc", "label": "Vocabulary · Câu 21", "q": "I ________ on the amount of fat I eat to lose some weight.", "opts": ["cut out", "cut down", "am cutting down", "look down"], "a": 1}, {"id": "v22", "lesson": 2, "type": "mc", "label": "Vocabulary · Câu 22", "q": "He is a ________ thinker. He has sharp ideas and tries to see things in many aspects.", "opts": ["critic", "criticism", "critical", "criticising"], "a": 2}, {"id": "v23", "lesson": 2, "type": "mc", "label": "Vocabulary · Câu 23", "q": "The screens ________ blue light that can prevent you from sleeping well.", "opts": ["pass away", "turn out", "hand in", "give off"], "a": 3}, {"id": "v24", "lesson": 2, "type": "mc", "label": "Vocabulary · Câu 24", "q": "Choose the word OPPOSITE in meaning to the underlined word:\nJane found herself in [[conflict]] with her parents over her future career.", "opts": ["disagreement", "harmony", "controversy", "combat"], "a": 1}, {"id": "v25", "lesson": 2, "type": "mc", "label": "Vocabulary · Câu 25", "q": "Choose the word OPPOSITE in meaning to the underlined word:\nTeenagers nowadays are very [[curious]] about new technology.", "opts": ["inquisitive", "interested", "indifferent", "eager"], "a": 2}, {"id": "v26", "lesson": 2, "type": "mc", "label": "Vocabulary · Câu 26", "q": "Choose the word OPPOSITE in meaning to the underlined word:\nIn the future, we will use more [[renewable]] sources of energy such as wind and solar power.", "opts": ["alternative", "limited", "inexhaustible", "endless"], "a": 1}, {"id": "v27", "lesson": 2, "type": "mc", "label": "Vocabulary · Câu 27", "q": "Choose the word OPPOSITE in meaning to the underlined word:\nThe building was made using [[modern]] construction techniques.", "opts": ["traditional", "basic", "advanced", "complex"], "a": 0}, {"id": "v28", "lesson": 2, "type": "mc", "label": "Vocabulary · Câu 28", "q": "Choose the word OPPOSITE in meaning to the underlined word:\nThe police are conducting a [[safety]] awareness programme in local schools.", "opts": ["certainty", "security", "danger", "doubt"], "a": 2}, {"id": "w1", "lesson": 3, "type": "mc", "label": "Writing · Câu 1", "q": "Choose the best arrangement:\na. Lan: I usually go jogging every morning to keep fit.\nb. Nam: That's great! I also try to eat more vegetables and drink enough water.\nc. Nam: How do you stay healthy every day?", "opts": ["a-b-c", "c-a-b", "b-c-a", "a-c-b"], "a": 1}, {"id": "w2", "lesson": 3, "type": "mc", "label": "Writing · Câu 2", "q": "Choose the best arrangement:\na. Renewable energy comes from natural sources like the sun, wind, and water.\nb. These sources can be used again and again without running out.\nc. Many countries are investing in renewable energy to protect the environment.\nd. What is renewable energy?", "opts": ["d-a-b-c", "a-b-d-c", "d-b-a-c", "a-d-c-b"], "a": 0}, {"id": "w3", "lesson": 3, "type": "mc", "label": "Writing · Câu 3", "q": "Choose the best arrangement:\na. Anna: That's great! Exercise and a good diet really help you stay healthy.\nb. Evan: I usually go for a jog in the morning and eat more vegetables.\nc. Anna: Hi! How do you keep yourself healthy every day?", "opts": ["c-b-a", "a-b-c", "b-c-a", "c-a-b"], "a": 0}, {"id": "w4", "lesson": 3, "type": "mc", "label": "Writing · Câu 4", "q": "Choose the best arrangement:\na. First, technology makes transportation faster and easier, so people can save time.\nb. Finally, citizens can access better healthcare, education, and safety services through digital platforms.\nc. Living in a smart city brings many benefits to people's daily lives.\nd. In conclusion, smart cities bring comfort, efficiency, and a higher quality of life.\ne. Moreover, smart systems help reduce pollution and keep the environment cleaner.", "opts": ["c-a-e-b-d", "a-e-c-b-d", "c-a-b-e-d", "a-e-b-c-d"], "a": 0}, {"id": "w5", "lesson": 3, "type": "mc", "label": "Writing · Câu 5", "q": "Choose the best arrangement:\na. Second, we should spend time with our family and friends to stay happy.\nb. Finally, we need to sleep enough and avoid stress.\nc. Having a good lifestyle helps us feel positive every day.\nd. First, we should eat healthy food and do regular exercise.\ne. If we do these things, our life will be better and healthier.", "opts": ["a-b-c-d-e", "c-d-a-b-e", "c-a-d-b-e", "c-d-a-e-b"], "a": 1}, {"id": "w6", "lesson": 3, "type": "mc", "label": "Writing · Câu 6", "q": "Choose the best arrangement:\na. First, we should eat more fruits and vegetables because they are good for our body.\nb. Second, we need to do exercise every day to stay fit and strong.\nc. Finally, we should sleep well and drink enough water to keep healthy.\nd. Staying healthy is very important for everyone.\ne. If we follow these tips, we will have a happy and healthy life.", "opts": ["a-b-c-d-e", "d-a-b-c-e", "d-b-a-c-e", "a-d-b-c-e"], "a": 1}, {"id": "w7", "lesson": 3, "type": "mc", "label": "Writing · Câu 7", "q": "Choose the best arrangement:\na. I've just joined a new health club in our town.\nb. Hi Anna!\nc. I think it would be fun and healthy if you joined with me.\nd. Let's go together this weekend!\ne. They have great fitness classes and a friendly environment.", "opts": ["b-c-a-e-d", "b-a-c-e-d", "b-a-e-c-d", "a-b-c-e-d"], "a": 2}, {"id": "w8", "lesson": 3, "type": "mc", "label": "Writing · Câu 8", "q": "Choose the best arrangement:\na. To prepare for jogging, wear comfortable clothes and good running shoes.\nb. It's also a good idea to stretch your muscles before starting to avoid injuries.\nc. Make sure you have a route planned and tell someone where you're going.\nd. Bring a water bottle to stay hydrated and a hat or sunglasses if it's sunny.\ne. Lastly, take your phone for safety and to track your progress. Enjoy your jog!", "opts": ["a-d-b-c-e", "a-c-d-b-e", "c-d-b-e-a", "a-b-d-e-c"], "a": 3}, {"id": "w9", "lesson": 3, "type": "mc", "label": "Writing · Câu 9", "q": "Choose the best arrangement:\na. How are you? Have you discovered any new recipes lately?\nb. Thanks for lending me your book about healthy cooking. It's great! I've already tried a few recipes, and they were delicious.\nc. Let's catch up soon and maybe cook together. Thanks again for the book!\nd. Hi Rachel,\ne. Best,\nf. I'm making the quinoa salad next.", "opts": ["d-b-f-a-c-e", "d-a-f-c-b-e", "d-b-a-f-c-e", "d-a-c-f-b-e"], "a": 2}, {"id": "w10", "lesson": 3, "type": "mc", "label": "Writing · Câu 10", "q": "Choose the best arrangement:\na. Mai: Mum, can I dye my hair? Just a little colour at the ends.\nb. Parent: You look serious. What do you want to talk about?\nc. Parent: Certainly not. Your school doesn't allow it.\nd. Parent: Colour your hair? Why do you want to do that?\ne. Mai: I think it would look cool, and some of my friends have done it.", "opts": ["c-a-d-e-b", "b-a-d-e-c", "b-e-d-a-c", "a-b-d-e-c"], "a": 1}];

};
let Q=[],S='';
const SJ=()=>SUBJ[S],WK=()=>S==='qp'?'wrong':'wrong_'+S,BK=()=>S==='qp'?'best':'best_'+S;

const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem('gdqp11_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('gdqp11_'+k,JSON.stringify(v))}catch(e){}}};
let cfg=Object.assign({name:'',lesson:'0',type:'all',count:'9999',time:'20',sq:true,sa:true,bots:true,snd:true},LS.get('cfg2',{}));
let G=null,ac;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const beep=(f,d=.12,t='sine',v=.15)=>{if(!cfg.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}};
const sndOk=()=>{beep(660);setTimeout(()=>beep(880,.18),110)},sndBad=()=>beep(190,.35,'sawtooth',.1);
const SH=['▲','◆','●','■'];
const BOTS=['Hùng Cá Rô','Mai Phương','Tuấn Bão Táp','Thảo Nguyên','Đạt Siêu Tốc','Linh Mèo Mập'];

const parseNum=s=>{const m=String(s||'').replace(/−/g,'-').replace(',','.').match(/-?\d+(?:\.\d+)?/);return m?parseFloat(m[0]):null};
function grp(s,i){let d=0,j=i;for(;j<s.length;j++){if(s[j]==='{')d++;else if(s[j]==='}'){d--;if(!d)break}}return[s.slice(i+1,j),j+1]}
function fm(s){let o='',i=0;while(i<s.length){
  if(s.startsWith('\\frac{',i)){const[a,j]=grp(s,i+5),[b,k]=grp(s,j);o+=`<span class="fr"><span>${fm(a)}</span><span>${fm(b)}</span></span>`;i=k}
  else if(s.startsWith('\\sqrt{',i)){const[a,j]=grp(s,i+5);o+=`√<span class="sq">${fm(a)}</span>`;i=j}
  else if(s[i]==='_'&&s[i+1]==='{'){const[a,j]=grp(s,i+1);o+=`<sub>${fm(a)}</sub>`;i=j}
  else if(s[i]==='^'&&s[i+1]==='{'){const[a,j]=grp(s,i+1);o+=`<sup>${fm(a)}</sup>`;i=j}
  else o+=s[i++]}return o}
const M=s=>fm(esc(s)).replace(/\[\[(.+?)\]\]/g,'<u>$1</u>').replace(/\n/g,'<br>');
const TP=s=>String(s??'').replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g,'$1/$2').replace(/\\sqrt\{([^{}]*)\}/g,'√($1)').replace(/[_^]\{([^{}]*)\}/g,'$1');
const AT=it=>it.type==='sh'?esc(String(it.ans).replace('.',','))+' '+esc(it.unit||''):M(it.opts[it.a]);
const CN=L=>{const c=t=>L.filter(q=>q.type===t).length,h=c('sh');return`${c('mc')} câu trắc nghiệm${c('tf')?` + ${c('tf')} câu đúng/sai (mỗi câu 4 ý)`:''}${h?` + ${h} câu trả lời ngắn`:''}`};
function sel(id,label,opts){return`<label>${label}<select id="${id}">${opts.map(([v,t])=>`<option value="${v}"${String(cfg[id])===v?' selected':''}>${t}</option>`).join('')}</select></label>`}
function chk(id,label){return`<label class="chk"><input type="checkbox" id="${id}"${cfg[id]?' checked':''}>${label}</label>`}

function home(){
  G=null;const wrong=LS.get(WK(),[]).filter(id=>Q.some(q=>q.id===id)),best=LS.get(BK(),0);
  app.innerHTML=`<div class="wrap"><button class="back" id="chg">← Đổi môn</button><h1>${SJ().icon} Quiz ${SJ().name}</h1>
  <p class="sub">Ôn tập giữa kỳ I · ${CN(Q)}${best?` · 🏆 Kỷ lục: ${best}`:''}</p>
  <div class="card"><label>Biệt danh<input type="text" id="name" maxlength="16" placeholder="Nhập tên của bạn" value="${esc(cfg.name)}"></label>
  <div class="grid2">
  ${SJ().lessons.length?sel('lesson','Phạm vi',[['0','Tất cả các bài'],...SJ().lessons]):'<input type="hidden" id="lesson" value="0">'}
  ${sel('type','Dạng câu hỏi',[['all','Tất cả các dạng'],['mc','Trắc nghiệm'],...(Q.some(q=>q.type==='tf')?[['tf','Đúng / Sai']]:[]),...(Q.some(q=>q.type==='sh')?[['sh','Trả lời ngắn']]:[])])}
  ${sel('count','Số câu',[['10','10 câu'],['20','20 câu'],['30','30 câu'],['9999','Tất cả']])}
  ${SJ().notime?`<input type="hidden" id="time" value="${cfg.time}">`:sel('time','Thời gian mỗi câu (đúng/sai ×2)',[['10','10 giây'],['20','20 giây'],['30','30 giây'],['60','60 giây'],['0','Không giới hạn']])}
  </div>
  <div class="grid2">${chk('sq','Xáo thứ tự câu hỏi')}${chk('sa','Xáo thứ tự đáp án')}${chk('bots','Bảng xếp hạng với bạn ảo')}${chk('snd','Âm thanh')}</div>
  <button class="btn" id="go">▶ Bắt đầu chơi</button>
  ${wrong.length?`<button class="btn alt" id="rv">🔁 Ôn lại ${wrong.length} câu đã sai</button>`:''}
  </div><p class="sub" style="font-size:.85rem;margin-top:16px">Phím tắt (trắc nghiệm): 1–4 hoặc A–D · Đúng/Sai: bấm từng ý rồi Enter để chốt · Trả lời ngắn: nhập số rồi Enter · Enter/Space để qua câu</p></div>`;
  $('#chg').onclick=subjects;$('#go').onclick=()=>start(false);if($('#rv'))$('#rv').onclick=()=>start(true);
}
function readCfg(){['lesson','type','count','time'].forEach(k=>cfg[k]=$('#'+k).value);['sq','sa','bots','snd'].forEach(k=>cfg[k]=$('#'+k).checked);cfg.name=$('#name').value.trim();LS.set('cfg2',cfg)}
function start(review){
  readCfg();
  let pool=Q.filter(q=>(cfg.lesson==='0'||q.lesson==cfg.lesson)&&(cfg.type==='all'||q.type===cfg.type));
  if(review){const w=LS.get(WK(),[]);pool=Q.filter(q=>w.includes(q.id))}
  if(!pool.length)return alert('Không có câu hỏi nào phù hợp với lựa chọn này.');
  if(cfg.sq||review)pool=shuffle(pool);
  pool=pool.slice(0,+cfg.count);
  G={items:pool,i:0,score:0,streak:0,maxStreak:0,ok:0,log:[],review,
     bots:cfg.bots?shuffle(BOTS).slice(0,5).map(n=>({n,s:0,p:.5+Math.random()*.4})):[]};
  ask();
}
function ask(){
  const it=G.items[G.i],tf=it.type==='tf',sh=it.type==='sh',T=SJ().notime?0:(+cfg.time)*(tf?2:1);G.T=T;G.done=false;G.t0=performance.now();G.pk=[];
  let ord=(tf||sh)?[]:it.opts.map((t,i)=>({t,i}));if(ord.length&&cfg.sa)ord=shuffle(ord);G.ord=ord;
  const body=sh?`<div class="sa"><input type="text" id="shin" inputmode="decimal" autocomplete="off" placeholder="Nhập đáp số"><span class="unit">${esc(it.unit||'')}</span></div><button class="btn" id="sub" disabled>Chốt đáp án ✔</button>`:tf?`<div class="sts">${it.sts.map((s,k)=>`<div class="st" data-k="${k}"><p><b>${'abcd'[k]})</b> ${M(s.t)}</p><div class="yn"><button class="a c1" data-v="0"><b>✔</b>Đúng</button><button class="a c0" data-v="1"><b>✘</b>Sai</button></div></div>`).join('')}</div><button class="btn" id="sub" disabled>Chốt đáp án ✔ (chọn đủ 4 ý)</button>`
   :`<div class="ans mc">${ord.map((o,k)=>`<button class="a c${k}" data-i="${o.i}"><b>${SH[k]}</b><span>${M(o.t)}</span></button>`).join('')}</div>`;
  app.innerHTML=`<div class="wrap"><div class="top"><button class="xb" id="xit" title="Thoát" aria-label="Thoát">✕</button><span class="sc">${G.i+1} / ${G.items.length}</span><span class="lbl">${esc(it.label)}${tf?' · Đúng/Sai (4 ý)':sh?' · Trả lời ngắn':''}</span><span class="sc">⭐ ${G.score}</span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="qbox">${tf?`<div class="ctx">${M(it.ctx)}</div>`:`<div class="q${/\n/.test(it.q)?' ml':''}">${M(it.q)}</div>`}${it.img?`<img class="qimg" src="${it.img}" alt="Hình minh họa">`:''}</div>${body}<div id="after"></div></div>`;
  $('#xit').onclick=()=>{clearInterval(G.tm);home()};
  if(tf){document.querySelectorAll('.st .a').forEach(b=>b.onclick=()=>{if(G.done)return;const row=b.closest('.st');G.pk[+row.dataset.k]=+b.dataset.v;
      row.querySelectorAll('.a').forEach(x=>x.classList.toggle('sel',x===b));row.classList.add('picked');
      const full=it.sts.every((s,k)=>G.pk[k]!=null);$('#sub').disabled=!full;if(full)$('#sub').textContent='Chốt đáp án ✔'});
    $('#sub').onclick=()=>answer(0)}
  else if(sh){const inp=$('#shin'),sb=$('#sub');inp.oninput=()=>{sb.disabled=!/\d/.test(inp.value)};inp.onkeydown=e=>{if(e.key==='Enter'&&!sb.disabled){e.preventDefault();answer(0)}};sb.onclick=()=>answer(0);inp.focus()}
  else document.querySelectorAll('.a').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  clearInterval(G.tm);
  if(T){const bar=$('#bar');G.tm=setInterval(()=>{const left=1-(performance.now()-G.t0)/1000/T;bar.style.width=Math.max(0,left*100)+'%';if(left<=0)answer(-1)},100)}
  else $('#bar').parentElement.style.visibility='hidden';
}
function answer(pick){
  if(G.done)return;G.done=true;clearInterval(G.tm);
  const it=G.items[G.i],tf=it.type==='tf',sh=it.type==='sh',T=G.T,el=(performance.now()-G.t0)/1000;const shv=sh?parseNum($('#shin').value):null;
  const n=tf?it.sts.filter((s,k)=>G.pk[k]===s.a).length:0;
  const right=tf?n===4:sh?(shv!=null&&Math.abs(shv-it.ans)<=(it.tol||0.01)):pick===it.a,frac=tf?n/4:(right?1:0);let pts=0;
  const w=new Set(LS.get(WK(),[]));
  if(frac)pts=Math.round((T?1000*(1-Math.min(el/T,1)/2):1000)*frac);
  if(right){G.streak++;G.ok++;G.maxStreak=Math.max(G.maxStreak,G.streak);pts+=Math.min(G.streak-1,5)*100;w.delete(it.id);sndOk()}
  else{G.streak=0;w.add(it.id);sndBad()}
  G.score+=pts;LS.set(WK(),[...w]);G.log.push({it,pick:tf?G.pk.slice():sh?$('#shin').value:pick,right,n});
  G.bots.forEach(b=>{if(Math.random()<b.p)b.s+=Math.round(1000*(1-(.15+Math.random()*.7)/2))});
  if(tf){document.querySelectorAll('.st').forEach((r,k)=>{const s=it.sts[k];r.classList.add('done');if(s.ex)r.insertAdjacentHTML('beforeend','<p class="exp">💡 '+M(s.ex)+'</p>');
      r.querySelectorAll('.a').forEach(b=>{const v=+b.dataset.v;b.disabled=true;b.classList.remove('sel');b.classList.add(v===s.a?'ok':v===G.pk[k]?'no':'dim')})});$('#sub').remove()}
  else if(sh){const inp=$('#shin');inp.disabled=true;inp.classList.add(right?'ok':'no');inp.blur();$('#sub').remove()}
  else document.querySelectorAll('.a').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add(i===it.a?'ok':i===pick?'no':'dim')});
  const rows=[{n:cfg.name||'Bạn',s:G.score,me:1},...G.bots].sort((a,b)=>b.s-a.s);
  const last=G.i+1>=G.items.length,mi=rows.findIndex(r=>r.me);
  $('#after').innerHTML=`<div class="fb ${right?'good':'bad'}"><div><h2>${right?'Chính xác! ✅':tf?(n?`Đúng ${n}/4 ý 👍`:'Chưa đúng ❌'):pick<0?'Hết giờ! ⏰':'Chưa đúng ❌'}</h2>
  <p>${right?`+${pts} điểm${G.streak>1?` · 🔥 chuỗi ${G.streak} câu`:''}`:tf?`+${pts} điểm · ý sai được tô mờ, ý đúng viền trắng`:`Đáp án đúng: <b>${AT(it)}</b>`}</p>${it.ex?`<p class="exp">💡 ${M(it.ex)}</p>`:''}</div>
  <button class="btn" id="next">${last?'Xem kết quả 🏁':'Tiếp tục ▶'}</button></div>
  ${G.bots.length?`<div class="board">${rows.slice(0,5).map((r,k)=>`<div class="${r.me?'me':''}"><span>${k+1}. ${esc(r.n)}</span><span>${r.s}</span></div>`).join('')}${mi>4?`<div class="me"><span>${mi+1}. ${esc(cfg.name||'Bạn')}</span><span>${G.score}</span></div>`:''}</div>`:''}`;
  $('#next').onclick=()=>{G.i++;last?finish():ask()};$('#next').scrollIntoView?.({block:'nearest',behavior:'smooth'});
}
const rv=l=>{const it=l.it,tf=it.type==='tf',sh=it.type==='sh',t=TP(it.q||it.ctx);return`<details><summary>${esc(it.label)}: ${esc(t.slice(0,90))}${t.length>90?'…':''}</summary>`+(it.img?`<img class="qimg" src="${it.img}" alt="">`:'')+(tf?`<p><i>${M(it.ctx)}</i></p>`+it.sts.map((s,k)=>{const ok=l.pick[k]===s.a;return`<p class="${ok?'ok-t':'no-t'}">${'abcd'[k]}) ${M(s.t)}<br>Bạn chọn: ${l.pick[k]==null?'(bỏ trống)':['Đúng','Sai'][l.pick[k]]} · Đáp án: ${['Đúng','Sai'][s.a]}</p>`}).join(''):sh?`<p>${M(it.q)}</p><p class="no-t">Bạn nhập: ${l.pick?esc(l.pick):'(bỏ trống)'}</p><p class="ok-t">Đáp án đúng: ${AT(it)}</p>`:`<p>${M(it.q)}</p><p class="no-t">Bạn chọn: ${l.pick<0?'(hết giờ)':M(it.opts[l.pick])}</p><p class="ok-t">Đáp án đúng: ${M(it.opts[it.a])}</p>`)+(it.ex?`<p>💡 ${M(it.ex)}</p>`:'')+'</details>'};
function finish(){
  const n=G.items.length,pct=Math.round(G.ok/n*100),best=LS.get(BK(),0),newBest=!G.review&&G.score>best;if(newBest)LS.set(BK(),G.score);
  const rows=[{n:cfg.name||'Bạn',s:G.score,me:1},...G.bots].sort((a,b)=>b.s-a.s),rank=rows.findIndex(r=>r.me)+1;
  const wr=G.log.filter(l=>!l.right);
  app.innerHTML=`<div class="wrap"><h1>${pct>=80?'🏆 Xuất sắc!':pct>=50?'👍 Khá tốt!':'💪 Cố gắng lên!'}</h1>
  <p class="sub">${newBest?'🎉 Kỷ lục mới! ':''}${G.bots.length?`Bạn xếp hạng ${rank}/${rows.length}`:''}</p>
  ${G.bots.length?`<div class="podium">${[1,0,2].map(k=>rows[k]?`<div class="p${k+1}">${['🥇','🥈','🥉'][k]}<br>${esc(rows[k].n)}<br>${rows[k].s}</div>`:'').join('')}</div>`:''}
  <div class="stats"><div><b>${G.score}</b>Điểm</div><div><b>${G.ok}/${n}</b>Câu đúng (${pct}%)</div><div><b>🔥 ${G.maxStreak}</b>Chuỗi dài nhất</div></div>
  ${wr.length?`<h3>Các câu cần xem lại (${wr.length})</h3><div class="rev">${wr.map(rv).join('')}</div>`:'<p class="sub">Không sai câu nào, quá đỉnh! 🎯</p>'}
  <button class="btn" id="again">🔄 Chơi lại</button>
  ${LS.get(WK(),[]).length?`<button class="btn alt" id="rv">🔁 Ôn lại các câu đã sai</button>`:''}
  <button class="btn red" id="hm">🏠 Về trang chủ</button></div>`;
  $('#again').onclick=()=>{G.review?start(true):start(false)};$('#hm').onclick=home;
  if($('#rv'))$('#rv').onclick=()=>start(true);
  if(pct>=50)[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.2),i*140));
}
// Chơi lại cần cấu hình đang hiển thị -> start() đọc từ form; ở màn kết quả dùng cfg đã lưu
const _start=start;start=function(r){if(!$('#lesson')){_start2(r)}else _start(r)};
function _start2(review){
  let pool=Q.filter(q=>(cfg.lesson==='0'||q.lesson==cfg.lesson)&&(cfg.type==='all'||q.type===cfg.type));
  if(review){const w=LS.get(WK(),[]);pool=Q.filter(q=>w.includes(q.id))}
  if(!pool.length)return home();
  if(cfg.sq||review)pool=shuffle(pool);pool=pool.slice(0,+cfg.count);
  G={items:pool,i:0,score:0,streak:0,maxStreak:0,ok:0,log:[],review,bots:cfg.bots?shuffle(BOTS).slice(0,5).map(n=>({n,s:0,p:.5+Math.random()*.4})):[]};ask();
}
document.addEventListener('keydown',e=>{
  if(!G||e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  const k=e.key.toLowerCase();
  if(G.done){if(['enter',' ','arrowright'].includes(k)){e.preventDefault();$('#next')&&$('#next').click()}return}
  const it=G.items[G.i];
  if(it.type==='sh')return;
  if(it.type==='tf'){if(k==='enter'&&$('#sub')&&!$('#sub').disabled)$('#sub').click();return}
  let idx='1234'.indexOf(k);if(idx<0)idx='abcd'.indexOf(k);
  if(idx>=0&&G.ord[idx])answer(G.ord[idx].i);
});
function subjects(){
  G=null;Q=[];S='';
  app.innerHTML=`<div class="wrap"><h1>📚 Ôn tập giữa kỳ I</h1><p class="sub">Chọn môn để bắt đầu</p>
  <div class="subs">${Object.entries(SUBJ).map(([k,s])=>{const m=s.Q.filter(q=>q.type==='mc').length,f=s.Q.filter(q=>q.type==='tf').length,h=s.Q.filter(q=>q.type==='sh').length;
   return`<button class="sbj" data-k="${k}" style="background:${s.color}"><span class="ic">${s.icon}</span><b>${s.name}</b><small>${s.desc}</small><em>${m} trắc nghiệm${f?` · ${f} đúng/sai`:''}${h?` · ${h} trả lời ngắn`:''}</em></button>`}).join('')}</div></div>`;
  document.querySelectorAll('.sbj').forEach(b=>b.onclick=()=>{S=b.dataset.k;Q=SJ().Q;cfg.lesson='0';home()});
}
subjects();
