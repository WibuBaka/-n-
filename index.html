<style>

<script>
const Q=[{"id":"1","lesson":1,"type":"mc","label":"Câu 1","q":"Biên giới quốc gia của nước Cộng hòa xã hội chủ nghĩa Việt Nam bao gồm những bộ phận nào?","opts":["Biên giới trên đất liền, biên giới trên biển, biên giới trên không và biên giới trong lòng đất.","Đất liền, vùng biển và vùng trời.","Lãnh thổ và các cột mốc biên giới.","Lãnh thổ, quần đảo và vùng trời."],"a":0},{"id":"2","lesson":1,"type":"mc","label":"Câu 2","q":"Vùng nước tiếp giáp với bờ biển, ở phía trong đường cơ sở và là bộ phận lãnh thổ Việt Nam được gọi là gì?","opts":["Nội thủy.","Lãnh hải.","Thềm lục địa.","Vùng tiếp giáp lãnh hải."],"a":0},{"id":"3","lesson":1,"type":"mc","label":"Câu 3","q":"Vùng biển tiếp liền và nằm ngoài lãnh hải Việt Nam, hợp với lãnh hải thành vùng biển rộng 200 hải lý tính từ đường cơ sở, được gọi là gì?","opts":["Vùng nội thủy.","Thềm lục địa.","Vùng đặc quyền kinh tế.","Vùng tiếp giáp lãnh hải."],"a":2},{"id":"4","lesson":1,"type":"mc","label":"Câu 4","q":"Theo Luật Biển Việt Nam năm 2012, đường cơ sở dùng để tính chiều rộng lãnh hải Việt Nam là đường nào?","opts":["Đường cơ sở do Chính phủ công bố.","Đường cơ sở thẳng do Chính phủ công bố.","Đường cơ sở thông thường.","Đường cơ sở thông thường và đường cơ sở thẳng."],"a":1},{"id":"5","lesson":1,"type":"mc","label":"Câu 5","q":"Theo Chiến lược bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa trong tình hình mới, những ai tôn trọng (……), thiết lập và mở rộng quan hệ hữu nghị, hợp tác bình đẳng, cùng có lợi với Việt Nam đều là đối tác.","opts":["Độc lập, chủ quyền.","Độc lập, tự do.","Độc lập, tự quyết, tự do.","Độc lập, chủ quyền, tự do."],"a":0},{"id":"6","lesson":1,"type":"mc","label":"Câu 6","q":"Bất kỳ thế lực nào có âm mưu và hành động chống phá (……) trong sự nghiệp xây dựng và bảo vệ Tổ quốc đều là đối tượng đấu tranh của chúng ta.","opts":["Hòa bình của nước ta.","Độc lập, tự do của nước ta.","Mục tiêu của nước ta.","Chế độ xã hội chủ nghĩa của nước ta."],"a":2},{"id":"7","lesson":1,"type":"mc","label":"Câu 7","q":"Những ai tôn trọng độc lập, chủ quyền và thiết lập, mở rộng quan hệ hữu nghị, hợp tác bình đẳng, cùng có lợi với Việt Nam đều là gì?","opts":["Đồng chí của chúng ta.","Đối tác của chúng ta.","Đối tượng của chúng ta.","Bạn bè của chúng ta."],"a":1},{"id":"8","lesson":1,"type":"mc","label":"Câu 8","q":"Thế lực có âm mưu và hành động chống phá mục tiêu của nước ta trong sự nghiệp xây dựng và bảo vệ Tổ quốc được xác định là gì?","opts":["Thù địch của chúng ta.","Đối thủ của chúng ta.","Đối tượng của chúng ta.","Kẻ thù của chúng ta."],"a":2},{"id":"9","lesson":1,"type":"mc","label":"Câu 9","q":"Luật Biển Việt Nam quy định về đường cơ sở, các vùng biển, thềm lục địa, (……) thuộc chủ quyền, quyền chủ quyền, quyền tài phán quốc gia của Việt Nam.","opts":["Các đảo, quần đảo.","Các đảo, bán đảo và quần đảo.","Các đảo, quần đảo Hoàng Sa, quần đảo Trường Sa và bán đảo.","Các đảo, quần đảo Hoàng Sa, quần đảo Trường Sa và các quần đảo khác."],"a":3},{"id":"10","lesson":1,"type":"mc","label":"Câu 10","q":"Lãnh hải Việt Nam có chiều rộng tính từ đường cơ sở ra phía biển là bao nhiêu?","opts":["12 hải lý.","24 hải lý.","188 hải lý.","388 hải lý."],"a":0},{"id":"11","lesson":1,"type":"mc","label":"Câu 11","q":"Vùng đặc quyền kinh tế hợp với lãnh hải thành vùng biển có chiều rộng tính từ đường cơ sở là bao nhiêu?","opts":["212 hải lý.","200 hải lý.","224 hải lý.","350 hải lý."],"a":1},{"id":"12","lesson":1,"type":"mc","label":"Câu 12","q":"Ranh giới ngoài của thềm lục địa Việt Nam cách đường cơ sở không quá bao nhiêu hải lý, theo giới hạn tối đa được nêu trong luật?","opts":["212 hải lý.","200 hải lý.","224 hải lý.","350 hải lý."],"a":3},{"id":"13","lesson":1,"type":"mc","label":"Câu 13","q":"Khu vực biên giới trên không là phần không gian dọc theo biên giới quốc gia, có chiều rộng tính từ biên giới quốc gia trở vào là bao nhiêu?","opts":["25 km.","20 km.","15 km.","10 km."],"a":3},{"id":"14","lesson":1,"type":"tf","label":"Câu 14","ctx":"Đọc thông tin: Luật Biển Việt Nam quy định về đường cơ sở, nội thủy, lãnh hải, vùng tiếp giáp lãnh hải, vùng đặc quyền kinh tế, thềm lục địa, các đảo và quần đảo thuộc chủ quyền, quyền chủ quyền, quyền tài phán quốc gia của Việt Nam; hoạt động trong vùng biển Việt Nam; phát triển kinh tế biển; quản lý và bảo vệ biển, đảo. (Luật số 18/2012/QH13, thông qua ngày 21-6-2012, có hiệu lực từ ngày 01-01-2013).","sts":[{"t":"Lãnh hải có chiều rộng 12 hải lý tính từ đường cơ sở ra phía biển.","a":0},{"t":"Vùng tiếp giáp lãnh hải có chiều rộng 24 hải lý tính từ ranh giới ngoài của lãnh hải.","a":1},{"t":"Vùng đặc quyền kinh tế có chiều rộng 240 hải lý tính từ đường cơ sở.","a":1},{"t":"Ranh giới ngoài của thềm lục địa có thể được xác định đến giới hạn tối đa 350 hải lý tính từ đường cơ sở.","a":0}]},{"id":"15","lesson":1,"type":"tf","label":"Câu 15","ctx":"Kiên sống gần khu vực Ngã ba Đông Dương, thuộc xã Bờ Y. Một du khách đề nghị Kiên chỉ đường đi tắt qua biên giới sang Lào và Campuchia để chụp ảnh rồi quay lại. Hãy xác định đúng/sai:","sts":[{"t":"Kiên giải thích rằng qua lại trái phép biên giới quốc gia là hành vi bị nghiêm cấm.","a":0},{"t":"Kiên nhận lời vì chỉ sang chụp ảnh kỷ niệm thì không vi phạm.","a":1},{"t":"Kiên từ chối và hướng dẫn du khách thực hiện thủ tục xuất, nhập cảnh tại cửa khẩu được phép.","a":0},{"t":"Kiên nhận lời vì việc đó góp phần thu hút khách du lịch.","a":1}]},{"id":"16","lesson":1,"type":"tf","label":"Câu 16","ctx":"Minh cùng nhóm bạn đến tham quan khu vực biên giới trên đất liền. Minh định dùng flycam bay qua biên giới quốc gia trên không để chụp ảnh phía nước láng giềng. Hãy xác định đúng/sai:","sts":[{"t":"Tự ý điều khiển flycam bay qua biên giới quốc gia để ghi hình phía bên kia là hành vi không được phép.","a":0},{"t":"Tự ý cho flycam bay qua biên giới quốc gia trên không là hành vi bị nghiêm cấm.","a":0},{"t":"Có thể tự ý cho flycam bay qua biên giới nếu không chụp ảnh.","a":1},{"t":"Có thể tự ý bay qua biên giới để chụp phong cảnh, miễn là không ghi hình người hoặc công trình.","a":1}]},{"id":"17","lesson":1,"type":"tf","label":"Câu 17","ctx":"Trong một cuộc hội thảo về Luật Biển Việt Nam, một phóng viên đặt câu hỏi về các giới hạn và phạm vi chủ quyền của Việt Nam trên biển. Dựa vào tình huống trên, hãy xác định các nhận định sau là đúng hay sai:","sts":[{"t":"Vùng tiếp giáp lãnh hải là vùng biển tiếp liền và nằm ngoài lãnh hải Việt Nam, có chiều rộng 12 hải lý tính từ ranh giới ngoài của lãnh hải.","a":0},{"t":"Ranh giới ngoài của thềm lục địa cách đường cơ sở không quá 200 hải lý.","a":1},{"t":"Việt Nam có quyền xây dựng các đảo nhân tạo và công trình khác trong vùng đặc quyền kinh tế để phục vụ mục đích kinh tế.","a":0},{"t":"Tàu thuyền của tất cả các quốc gia được hưởng quyền đi qua không gây hại trong lãnh hải Việt Nam. Đối với tàu quân sự nước ngoài khi thực hiện quyền đi qua không gây hại trong lãnh hải Việt Nam, cũng không cần thông báo trước cho cơ quan có thẩm quyền của Việt Nam.","a":1}]},{"id":"18","lesson":2,"type":"mc","label":"Câu 18","q":"Công dân trong độ tuổi thực hiện nghĩa vụ quân sự, không phân biệt (……), phải thực hiện nghĩa vụ quân sự theo quy định của pháp luật.","opts":["Dân tộc, thành phần xã hội, tín ngưỡng, tôn giáo, trình độ học vấn.","Dân tộc, thành phần xã hội, tín ngưỡng, tôn giáo, trình độ học vấn, nghề nghiệp.","Dân tộc, thành phần xã hội, tín ngưỡng, tôn giáo, trình độ học vấn, nghề nghiệp, nơi cư trú.","Dân tộc, thành phần xã hội, tín ngưỡng, tôn giáo, trình độ học vấn, nghề nghiệp, nơi cư trú, nơi làm việc"],"a":2},{"id":"19","lesson":2,"type":"mc","label":"Câu 19","q":"Trường hợp nào sau đây đủ điều kiện đăng ký nghĩa vụ quân sự theo quy định?","opts":["Công dân nam đủ 17 tuổi đang bị truy cứu trách nhiệm hình sự.","Công dân nam đủ 17 tuổi đang chấp hành hình phạt quản chế.","Công dân nam đủ 17 tuổi đã chấp hành xong hình phạt tù nhưng chưa được xóa án tích.","Công dân nam đủ 17 tuổi đã chấp hành xong quyết định áp dụng biện pháp giáo dục tại cấp xã và có giấy chứng nhận theo quy định."],"a":3},{"id":"20","lesson":2,"type":"mc","label":"Câu 20","q":"Hằng năm, Chủ tịch UBND cấp xã quyết định gọi công dân đăng ký nghĩa vụ quân sự lần đầu vào tháng nào?","opts":["Tháng Hai.","Tháng Ba.","Tháng Tư.","Tháng Năm."],"a":2},{"id":"21","lesson":2,"type":"mc","label":"Câu 21","q":"Công dân thực hiện đăng ký nghĩa vụ quân sự lần đầu tại cơ quan nào theo quy định?","opts":["Tổ dân phố hoặc thôn.","Ban Chỉ huy quân sự cấp xã.","Ban Chỉ huy quân sự cấp tỉnh.","Nhà trường nơi đang học."],"a":1},{"id":"22","lesson":2,"type":"mc","label":"Câu 22","q":"Công dân nam được gọi nhập ngũ khi đủ bao nhiêu tuổi?","opts":["17 tuổi.","18 tuổi.","19 tuổi.","20 tuổi."],"a":0},{"id":"23","lesson":2,"type":"mc","label":"Câu 23","q":"Độ tuổi gọi nhập ngũ thông thường của công dân là:","opts":["Từ đủ 17 tuổi đến hết 25 tuổi.","Từ đủ 17 tuổi đến hết 27 tuổi.","Từ đủ 18 tuổi đến hết 25 tuổi.","Từ đủ 18 tuổi đến hết 27 tuổi."],"a":2},{"id":"24","lesson":2,"type":"mc","label":"Câu 24","q":"Công dân được tạm hoãn gọi nhập ngũ vì học cao đẳng, đại học thì độ tuổi gọi nhập ngũ có thể kéo dài đến hết:","opts":["25 tuổi.","26 tuổi.","27 tuổi.","28 tuổi."],"a":2},{"id":"25","lesson":2,"type":"mc","label":"Câu 25","q":"Hằng năm, công dân thuộc diện gọi nhập ngũ được gọi khám sức khỏe trong khoảng thời gian nào theo quy định hiện hành được nêu trong tài liệu học tập?","opts":["Từ ngày 01-10 đến hết ngày 30-11.","Từ ngày 01-11 đến hết ngày 30-11.","Từ ngày 01-11 đến hết ngày 31-12.","Từ ngày 01-12 đến hết ngày 31-12."],"a":2},{"id":"26","lesson":2,"type":"mc","label":"Câu 26","q":"Công dân là con của bệnh binh hoặc người nhiễm chất độc da cam suy giảm khả năng lao động từ mức nào thuộc diện tạm hoãn gọi nhập ngũ theo quy định được nêu trong tài liệu?","opts":["Từ 21% đến 40%.","Từ 41% đến 60%.","Từ 61% đến 80%.","Từ 81% trở lên."],"a":2},{"id":"27","lesson":2,"type":"mc","label":"Câu 27","q":"Công dân là một con của bệnh binh suy giảm khả năng lao động từ mức nào thuộc diện miễn gọi nhập ngũ theo quy định?","opts":["Từ 61% trở lên.","Từ 81% trở lên.","Từ 41% trở lên.","Từ 21% trở lên."],"a":1},{"id":"28","lesson":2,"type":"mc","label":"Câu 28","q":"Công dân là một con của người nhiễm chất độc da cam suy giảm khả năng lao động từ mức nào thuộc diện miễn gọi nhập ngũ theo quy định?","opts":["Từ 81% trở lên.","Từ 61% trở lên.","Từ 41% trở lên.","Từ 21% trở lên."],"a":0},{"id":"29","lesson":2,"type":"mc","label":"Câu 29","q":"Dân quân thường trực được công nhận hoàn thành nghĩa vụ quân sự tại ngũ trong thời bình khi có ít nhất bao nhiêu tháng phục vụ?","opts":["48 tháng.","36 tháng.","24 tháng.","18 tháng."],"a":2},{"id":"30","lesson":2,"type":"mc","label":"Câu 30","q":"Công dân hoàn thành nhiệm vụ tham gia Công an xã liên tục từ đủ bao nhiêu tháng trở lên có thể được công nhận hoàn thành nghĩa vụ quân sự tại ngũ trong thời bình theo quy định tương ứng?","opts":["60 tháng.","48 tháng.","36 tháng.","24 tháng."],"a":2},{"id":"31","lesson":2,"type":"mc","label":"Câu 31","q":"Công dân phục vụ trên tàu kiểm ngư từ đủ bao nhiêu tháng trở lên có thể được công nhận hoàn thành nghĩa vụ quân sự tại ngũ trong thời bình?","opts":["48 tháng.","42 tháng.","36 tháng.","24 tháng."],"a":3},{"id":"32","lesson":2,"type":"mc","label":"Câu 32","q":"Thời hạn phục vụ tại ngũ trong thời bình của hạ sĩ quan, binh sĩ là bao lâu?","opts":["12 tháng.","18 tháng.","24 tháng.","30 tháng."],"a":2},{"id":"33","lesson":2,"type":"mc","label":"Câu 33","q":"Trong trường hợp cần thiết vì lý do quốc phòng, an ninh, thời hạn phục vụ tại ngũ của hạ sĩ quan, binh sĩ có thể được kéo dài nhưng không quá bao lâu?","opts":["3 tháng.","6 tháng.","9 tháng.","12 tháng."],"a":1},{"id":"34","lesson":2,"type":"mc","label":"Câu 34","q":"Công dân nữ trong độ tuổi gọi nhập ngũ đã đăng ký nghĩa vụ quân sự, có chuyên môn phù hợp với yêu cầu của Công an nhân dân, (……) thì thuộc đối tượng tuyển chọn thực hiện nghĩa vụ tham gia Công an nhân dân.","opts":["Nếu tự nguyện.","Nếu Công an nhân dân có nhu cầu.","Nếu tự nguyện và Công an nhân dân có nhu cầu.","Nếu tự nguyện và Công an nhân dân yêu cầu."],"a":2},{"id":"35","lesson":2,"type":"mc","label":"Câu 35","q":"Độ tuổi tuyển chọn và ngành, nghề cần thiết để tuyển chọn công dân nữ thực hiện nghĩa vụ tham gia Công an nhân dân do ai quy định?","opts":["Bộ trưởng Bộ Công an.","Cục trưởng Cục Tổ chức cán bộ Bộ Công an.","Bộ trưởng Bộ Quốc phòng.","Bộ trưởng Bộ Nội vụ."],"a":0},{"id":"36","lesson":2,"type":"mc","label":"Câu 36","q":"Hồ sơ tuyển chọn công dân thực hiện nghĩa vụ tham gia Công an nhân dân gồm những giấy tờ nào theo quy định được nêu trong tài liệu?","opts":["Tờ khai đăng ký thực hiện nghĩa vụ tham gia Công an nhân dân; phiếu tự khai sức khỏe nghĩa vụ quân sự.","Tờ khai đăng ký thực hiện nghĩa vụ tham gia Công an nhân dân; giấy chứng nhận đăng ký nghĩa vụ quân sự.","Tờ khai đăng ký thực hiện nghĩa vụ tham gia Công an nhân dân; giấy chứng nhận đăng ký nghĩa vụ quân sự; bản chụp căn cước hoặc giấy tờ nhân thân hợp lệ.","Giấy chứng nhận đăng ký nghĩa vụ quân sự; phiếu tự khai sức khỏe; bản chụp giấy tờ nhân thân."],"a":1},{"id":"37","lesson":2,"type":"mc","label":"Câu 37","q":"Việc gọi sơ tuyển, khám sức khỏe và quyết định gọi từng công dân thực hiện nghĩa vụ tham gia Công an nhân dân do cơ quan hoặc người có thẩm quyền nào quyết định theo quy định hiện hành?","opts":["Chủ tịch UBND cấp xã.","Giám đốc Công an cấp tỉnh.","Chủ tịch UBND cấp tỉnh.","Trưởng Công an cấp xã."],"a":0},{"id":"38","lesson":2,"type":"tf","label":"Câu 38","ctx":"Quân là thành viên đội bóng rổ của lớp. Ngày thi đấu trận chung kết trùng với ngày ghi trong quyết định gọi khám sức khỏe nghĩa vụ quân sự. Quân phân vân vì muốn dự thi đấu rồi hôm sau mới đi khám. Hãy xác định đúng/sai:","sts":[{"t":"Lịch thi đấu đã được xếp trước nên đương nhiên là lý do chính đáng để vắng mặt khi khám sức khỏe.","a":1},{"t":"Tự ý đi khám sức khỏe chậm một ngày mà không có lý do chính đáng là hành vi vi phạm quy định về nghĩa vụ quân sự.","a":0},{"t":"Quân cần chấp hành thời gian khám ghi trong quyết định; nếu có lý do cần điều chỉnh, phải báo ngay cơ quan có thẩm quyền và thực hiện theo hướng dẫn.","a":0},{"t":"Quân có thể tự quyết định dự thi đấu rồi hôm sau đến khám mà không cần thông báo.","a":1}]},{"id":"39","lesson":2,"type":"tf","label":"Câu 39","ctx":"Lâm và Huy cùng được gọi nhập ngũ. Trước ngày giao, nhận quân, Lâm bị trượt ngã, bong gân nặng, không thể đi lại. Huy đề nghị cả hai cùng xin hoãn. Hãy xác định đúng/sai:","sts":[{"t":"Lâm đương nhiên được tạm hoãn nhập ngũ chỉ vì bị tai nạn, không cần xác minh hoặc quyết định của cơ quan có thẩm quyền.","a":1},{"t":"Nếu tình trạng tai nạn, sức khỏe khiến Lâm không thể có mặt đúng thời gian, địa điểm, Lâm hoặc gia đình cần khẩn trương thông báo và cung cấp giấy tờ y tế để cơ quan có thẩm quyền xem xét.","a":0},{"t":"Trong một năm, việc gọi nhập ngũ thường được tổ chức nhiều đợt tùy ý ở mọi địa phương.","a":1},{"t":"Lâm nên liên hệ Ban Chỉ huy quân sự cấp xã hoặc cơ quan ghi trong quyết định, đồng thời cung cấp giấy xác nhận y tế; không tự ý bỏ chấp hành quyết định.","a":0}]},{"id":"40","lesson":2,"type":"tf","label":"Câu 40","ctx":"Bạn Lan muốn tìm hiểu về các tiêu chuẩn để được tạm hoãn và miễn gọi nhập ngũ theo Luật Nghĩa vụ quân sự. Hãy xác định các nhận định sau là đúng hay sai:","sts":[{"t":"Công dân nam đủ 17 tuổi phải thực hiện đăng ký nghĩa vụ quân sự lần đầu.","a":0},{"t":"Chỉ công dân bị bệnh hiểm nghèo mới được miễn gọi nhập ngũ.","a":1},{"t":"Việc tạm hoãn gọi nhập ngũ đối với sinh viên đang học đại học hệ chính quy được thực hiện nhằm bảo đảm nguồn nhân lực có trình độ cao cho đất nước.","a":0},{"t":"Một học sinh đang học lớp 12, chưa đủ 18 tuổi nhưng đã có giấy báo gọi nhập ngũ nên viết đơn xin tạm hoãn ngay lập tức.","a":1}]},{"id":"41","lesson":3,"type":"mc","label":"Câu 41","q":"Một trong những cách thức hoạt động phổ biến của tội phạm là:","opts":["Hoạt động độc lập, không có sự cấu kết.","Câu kết thành các băng nhóm, tổ chức để hoạt động.","Chỉ lưu động trên phạm vi xã, phường.","Không sử dụng các loại vũ khí, công cụ."],"a":1},{"id":"42","lesson":3,"type":"mc","label":"Câu 42","q":"“Hiện tượng xã hội tiêu cực, biểu hiện bằng hành vi lệch chuẩn mực xã hội, vi phạm đạo đức, pháp luật và gây nguy hiểm cho xã hội” là nội dung của khái niệm nào sau đây?","opts":["Tệ nạn xã hội.","Bạo lực gia đình.","Bạo lực học đường.","Tội phạm hình sự."],"a":0},{"id":"43","lesson":3,"type":"mc","label":"Câu 43","q":"Tệ nạn ma túy là các hành vi nào?","opts":["Tình trạng một hoặc nhiều người sử dụng trái phép chất ma túy, nghiện ma túy và các hành vi vi phạm pháp luật về ma túy nhưng chưa đến mức hoặc không bị truy cứu trách nhiệm hình sự.","Mua dâm, bán dâm và các hành vi khác có liên quan đến mua dâm, bán dâm.","Tin vào những điều mơ hồ dẫn đến cuồng tín, hành động trái với chuẩn mực xã hội.","Lợi dụng trò chơi để cá cược, sát phạt được thua bằng tiền hoặc lợi ích vật chất khác."],"a":0},{"id":"44","lesson":3,"type":"mc","label":"Câu 44","q":"Các hành vi nhằm thực hiện dịch vụ quan hệ tình dục có tính chất mua bán trên cơ sở một giá trị vật chất nhất định ngoài phạm vi hôn nhân là nội dung của khái niệm nào sau đây?","opts":["Tệ nạn ma túy.","Tệ nạn mại dâm.","Tệ nạn cờ bạc.","Tệ nạn mê tín dị đoan."],"a":1},{"id":"45","lesson":3,"type":"mc","label":"Câu 45","q":"Các hành vi lợi dụng hình thức vui chơi, giải trí để cá cược, sát phạt nhau bằng tiền hoặc hiện vật mà không được cơ quan nhà nước có thẩm quyền cho phép là nội dung của khái niệm nào sau đây?","opts":["Tệ nạn ma túy.","Tệ nạn mại dâm.","Tệ nạn cờ bạc.","Tệ nạn mê tín dị đoan."],"a":2},{"id":"46","lesson":3,"type":"mc","label":"Câu 46","q":"Các hành vi biểu hiện lòng tin mù quáng vào những điều huyền bí, không có thật, dẫn đến suy đoán khác thường, cuồng tín và hành động trái với chuẩn mực xã hội, không phù hợp với quy luật tự nhiên, là nội dung của khái niệm nào sau đây?","opts":["Tệ nạn ma túy.","Tệ nạn mại dâm.","Tệ nạn cờ bạc.","Tệ nạn mê tín dị đoan."],"a":3},{"id":"47","lesson":3,"type":"mc","label" function readCfg(){['lesson','type','count','time'].forEach(k=>cfg[k]=$('#'+k).value);['sq','sa','bots','snd'].forEach(k=>cfg[k]=$('#'+k).checked);cfg.name=$('#name').value.trim();LS.set('cfg2',cfg)}
function start(review){

  if(review){const w=LS.get('wrong',[]);pool=Q.filter(q=>w.includes(q.id))}

  if(cfg.sq||review)pool=shuffle(pool);

function ask(){

  app.innerHTML=`<div class="wrap"><div class="top"><span class="sc">${G.i+1} / ${G.items.length}</span><span class="lbl">${esc(it.label)}${tf?' · Đúng/Sai (4 ý)':''}</span><span class="sc">⭐ ${G.score}</span></div>
  <div class="bar"><i id="bar"></i></div>

  if(tf){document.querySelectorAll('.st .a').forEach(b=>b.onclick=()=>{if(G.done)return;const row=b.closest('.st');G.pk[+row.dataset.k]=+b.dataset.v;
      row.querySelectorAll('.a').forEach(x=>x.classList.toggle('sel',x===b));row.classList.add('picked');
      const full=it.sts.every((s,k)=>G.pk[k]!=null);$('#sub').disabled=!full;if(full)$('#sub').textContent='Chốt đáp án ✔'});
    $('#sub').onclick=()=>answer(0)}
  else document.querySelectorAll('.a').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  clearInterval(G.tm);
  if(T){const bar=$('#bar');G.tm=setInterval(()=>{const left=1-(performance.now()-G.t0)/1000/T;bar.style.width=Math.max(0,left*100)+'%';if(left<=0)answer(-1)},100)}
  else $('#bar').parentElement.style.visibility='hidden';
}
function answer(pick){
  if(G.done)return;G.done=true;clearInterval(G.tm);
  const it=G.items[G.i],tf=it.type==='tf',T=G.T,el=(performance.now()-G.t0)/1000;
  const n=tf?it.sts.filter((s,k)=>G.pk[k]===s.a).length:0;
  const right=tf?n===4:pick===it.a,frac=tf?n/4:(right?1:0);let pts=0;
  const w=new Set(LS.get('wrong',[]));
  if(frac)pts=Math.round((T?1000*(1-Math.min(el/T,1)/2):1000)*frac);
  if(right){G.streak++;G.ok++;G.maxStreak=Math.max(G.maxStreak,G.streak);pts+=Math.min(G.streak-1,5)*100;w.delete(it.id);sndOk()}
  else{G.streak=0;w.add(it.id);sndBad()}
  G.score+=pts;LS.set('wrong',[...w]);G.log.push({it,pick:tf?G.pk.slice():pick,right,n});

  const rows=[{n:cfg.name||'Bạn',s:G.score,me:1},...G.bots].sort((a,b)=>b.s-a.s);
  const last=G.i+1>=G.items.length,mi=rows.findIndex(r=>r.me);
  $('#after').innerHTML=`<div class="fb ${right?'good':'bad'}"><div><h2>${right?'Chính xác! ✅':tf?(n?`Đúng ${n}/4 ý 👍`:'Chưa đúng ❌'):pick<0?'Hết giờ! ⏰':'Chưa đúng ❌'}</h2>
  <p>${right?`+${pts} điểm${G.streak>1?` · 🔥 chuỗi ${G.streak} câu`:''}`:tf?`+${pts} điểm · ý sai được tô mờ, ý đúng viền trắng`:`Đáp án đúng: <b>${esc(it.opts[it.a])}</b>`}</p></div>
  <button class="btn" id="next">${last?'Xem kết quả 🏁':'Tiếp tục ▶'}</button></div>
  ${G.bots.length?`<div class="board">${rows.slice(0,5).map((r,k)=>`<div class="${r.me?'me':''}"><span>${k+1}. ${esc(r.n)}</span><span>${r.s}</span></div>`).join('')}${mi>4?`<div class="me"><span>${mi+1}. ${esc(cfg.name||'Bạn')}</span><span>${G.score}</span></div>`:''}</div>`:''}`;

}
const rv=l=>{const it=l.it,tf=it.type==='tf',t=it.q||it.ctx;return`<details><summary>${esc(it.label)}: ${esc(t.slice(0,90))}${t.length>90?'…':''}</summary>`+(tf?`<p><i>${esc(it.ctx)}</i></p>`+it.sts.map((s,k)=>{const ok=l.pick[k]===s.a;return`<p class="${ok?'ok-t':'no-t'}">${'abcd'[k]}) ${esc(s.t)}<br>Bạn chọn: ${l.pick[k]==null?'(bỏ trống)':['Đúng','Sai'][l.pick[k]]} · Đáp án: ${['Đúng','Sai'][s.a]}</p>`}).join(''):`<p>${esc(it.q)}</p><p class="no-t">Bạn chọn: ${l.pick<0?'(hết giờ)':esc(it.opts[l.pick])}</p><p class="ok-t">Đáp án đúng: ${esc(it.opts[it.a])}</p>`)+'</details>'};
function finish(){
  const n=G.items.length,pct=Math.round(G.ok/n*100),best=LS.get('best',0),newBest=!G.review&&G.score>best;if(newBest)LS.set('best',G.score);
  const rows=[{n:cfg.name||'Bạn',s:G.score,me:1},...G.bots].sort((a,b)=>b.s-a.s),rank=rows.findIndex(r=>r.me)+1;
  const wr=G.log.filter(l=>!l.right);
  app.innerHTML=`<div class="wrap"><h1>${pct>=80?'🏆 Xuất sắc!':pct>=50?'👍 Khá tốt!':'💪 Cố gắng lên!'}</h1>
  <p class="sub">${newBest?'🎉 Kỷ lục mới! ':''}${G.bots.length?`Bạn xếp hạng ${rank}/${rows.length}`:''}</p>
  ${G.bots.length?`<div class="podium">${[1,0,2].map(k=>rows[k]?`<div class="p${k+1}">${['🥇','🥈','🥉'][k]}<br>${esc(rows[k].n)}<br>${rows[k].s}</div>`:'').join('')}</div>`:''}
  <div class="stats"><div><b>${G.score}</b>Điểm</div><div><b>${G.ok}/${n}</b>Câu đúng (${pct}%)</div><div><b>🔥 ${G.maxStreak}</b>Chuỗi dài nhất</div></div>
  ${wr.length?`<h3>Các câu cần xem lại (${wr.length})</h3><div class="rev">${wr.map(rv).join('')}</div>`:'<p class="sub">Không sai câu nào, quá đỉnh! 🎯</p>'}
  <button class="btn" id="again">🔄 Chơi lại</button>
  ${LS.get('wrong',[]).length?`<button class="btn alt" id="rv">🔁 Ôn lại các câu đã sai</button>`:''}
  <button class="btn red" id="hm">🏠 Về trang chủ</button></div>`;
  $('#again').onclick=()=>{G.review?start(true):start(false)};$('#hm').onclick=home;
  if($('#rv'))$('#rv').onclick=()=>start(true);
  if(pct>=50)[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.2),i*140));
}
// Chơi lại cần cấu hình đang hiển thị -> start() đọc từ form; ở màn kết quả dùng cfg đã lưu
const _start=start;start=function(r){if(!$('#lesson')){_start2(r)}else _start(r)};
function _start2(review){
  let pool=Q.filter(q=>(cfg.lesson==='0'||q.lesson==cfg.lesson)&&(cfg.type==='all'||q.type===cfg.type));
  if(review){const w=LS.get('wrong',[]);pool=Q.filter(q=>w.includes(q.id))}
  if(!pool.length)return home();
  if(cfg.sq||review)pool=shuffle(pool);pool=pool.slice(0,+cfg.count);
  G={items:pool,i:0,score:0,streak:0,maxStreak:0,ok:0,log:[],review,bots:cfg.bots?shuffle(BOTS).slice(0,5).map(n=>({n,s:0,p:.5+Math.random()*.4})):[]};ask();
}
document.addEventListener('keydown',e=>{
  if(!G||e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  const k=e.key.toLowerCase();
  if(G.done){if(['enter',' ','arrowright'].includes(k)){e.preventDefault();$('#next')&&$('#next').click()}return}
  const it=G.items[G.i];
  if(it.type==='tf'){if(k==='enter'&&$('#sub')&&!$('#sub').disabled)$('#sub').click();return}
  let idx='1234'.indexOf(k);if(idx<0)idx='abcd'.indexOf(k);
  if(idx>=0&&G.ord[idx])answer(G.ord[idx].i);
});
home();
</script></body></html>
